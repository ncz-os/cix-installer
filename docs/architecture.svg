<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Menlo, Consolas, monospace" font-size="14">
  <style>
    .box { fill: #f6f8fa; stroke: #444; stroke-width: 1.5; }
    .layer { fill: #eef2ff; stroke: #3355aa; stroke-width: 1.5; }
    .lbl { font-weight: bold; fill: #111; }
    .sub { fill: #333; font-size: 12px; }
    .arrow { stroke: #444; stroke-width: 1.5; marker-end: url(#arrowhead); fill: none; }
    text { font-family: Menlo, Consolas, monospace; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 9 4, 0 8" fill="#444"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="880" height="460" rx="8" class="box"/>
  <text x="450" y="34" text-anchor="middle" class="lbl" font-size="16">ncz-installer-cixmini.iso</text>

  <!-- three squashfs layers -->
  <rect x="30" y="55" width="270" height="120" rx="6" class="layer"/>
  <text x="165" y="78" text-anchor="middle" class="lbl">base.squashfs</text>
  <text x="165" y="98" text-anchor="middle" class="sub">(1.7 GB)</text>
  <text x="165" y="118" text-anchor="middle" class="sub">debootstrapped resolute</text>
  <text x="165" y="136" text-anchor="middle" class="sub">+ Sky1 kernel/firmware</text>

  <rect x="315" y="55" width="270" height="120" rx="6" class="layer"/>
  <text x="450" y="78" text-anchor="middle" class="lbl">desktop.squashfs</text>
  <text x="450" y="98" text-anchor="middle" class="sub">(~852 MB)</text>
  <text x="450" y="118" text-anchor="middle" class="sub">XFCE + browser +</text>
  <text x="450" y="136" text-anchor="middle" class="sub">full desktop package set</text>

  <rect x="600" y="55" width="270" height="120" rx="6" class="layer"/>
  <text x="735" y="78" text-anchor="middle" class="lbl">server.squashfs</text>
  <text x="735" y="98" text-anchor="middle" class="sub">(~40 MB)</text>
  <text x="735" y="118" text-anchor="middle" class="sub">headless agent-appliance</text>
  <text x="735" y="136" text-anchor="middle" class="sub">packages</text>

  <!-- merge lines -->
  <line x1="165" y1="175" x2="450" y2="215" class="arrow" marker-end="none" stroke="#444" stroke-width="1.5"/>
  <line x1="450" y1="175" x2="450" y2="215" class="arrow" marker-end="none" stroke="#444" stroke-width="1.5"/>
  <line x1="735" y1="175" x2="450" y2="215" class="arrow" marker-end="none" stroke="#444" stroke-width="1.5"/>
  <text x="450" y="205" text-anchor="middle" class="sub" font-style="italic">overlaid at boot, per rEFInd choice</text>
  <line x1="450" y1="215" x2="450" y2="245" class="arrow"/>

  <!-- d-i box -->
  <rect x="60" y="255" width="780" height="150" rx="6" class="box"/>
  <text x="450" y="280" text-anchor="middle" class="lbl">Debian d-i base</text>
  <text x="450" y="302" text-anchor="middle" class="sub">UEFI boot, kernel + initrd, preseed, partman</text>
  <text x="450" y="326" text-anchor="middle" class="sub">extracts + overlays base + the selected variant (extract-rootfs.sh)</text>
  <text x="450" y="350" text-anchor="middle" class="sub">then runs post-install/*.sh hooks</text>
  <text x="450" y="380" text-anchor="middle" class="sub" font-style="italic">→ disk + filesystem chooser (btrfs default / ext4, no ZFS)</text>

  <line x1="450" y1="405" x2="450" y2="435" class="arrow"/>
  <rect x="200" y="435" width="500" height="30" rx="6" class="box"/>
  <text x="450" y="455" text-anchor="middle" class="sub">Installed system + NCZRESCUE recovery partition</text>
</svg>
