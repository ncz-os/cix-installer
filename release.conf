# NCZ-OS release identity.
# This is the single source of truth for installer and installed-system branding.
# BUILD_VERSION remains a separate per-artifact serial such as 2026.07.29-v14.
NCZ_PRODUCT_NAME="NCZ-OS"
NCZ_RELEASE_VERSION="26.10"
NCZ_RELEASE_CODENAME="Cygnus"
NCZ_BASE_NAME="Debian"
NCZ_BASE_VERSION="testing"
NCZ_BASE_CODENAME="forky"
NCZ_BASE_LABEL="Debian Testing (Forky)"
NCZ_BASE_COMPONENTS="main contrib non-free non-free-firmware"

# d-i's DAILY netboot substrate must fetch its own udebs from the matching
# live archive.  This is deliberately separate from the pinned mirror used to
# produce the squashfs: apt-setup does not add check-valid-until=no for release
# architectures, so an old snapshot blocks at "Configure the package manager".
NCZ_DI_MIRROR="https://deb.debian.org/debian"

# Forky (testing) is a MOVING TARGET -- unlike a frozen stable release, every
# unpinned build against deb.debian.org pulls whatever happens to be in
# testing at that exact moment. Two builds an hour apart can get different
# package versions with no record of which. Pin to a real snapshot.debian.org
# timestamp instead: reproducible, and every ISO's provenance is traceable to
# one exact archive state. Bump deliberately with build/pin-forky-snapshot.sh
# -- never let this silently drift, and never let it silently go stale either
# (preflight-freshness-gate.sh warns past NCZ_BASE_MIRROR_SNAPSHOT_MAX_AGE_DAYS).
#
# Snapshot Release files carry a short Valid-Until and DO expire -- consumers
# reading NCZ_BASE_MIRROR_APT_OPTS below must pass it through (mmdebstrap:
# --aptopt='Acquire::Check-Valid-Until=false'; apt sources.list: append it as
# a deb-line option) or every fetch against a pinned snapshot fails closed.
NCZ_BASE_MIRROR_SNAPSHOT="20261005T120000Z"
NCZ_BASE_MIRROR_SNAPSHOT_MAX_AGE_DAYS="14"
if [ -n "$NCZ_BASE_MIRROR_SNAPSHOT" ]; then
    NCZ_BASE_MIRROR="https://snapshot.debian.org/archive/debian/${NCZ_BASE_MIRROR_SNAPSHOT}"
    NCZ_BASE_MIRROR_APT_OPTS="check-valid-until=no"
else
    NCZ_BASE_MIRROR="https://deb.debian.org/debian"
    NCZ_BASE_MIRROR_APT_OPTS=""
fi

# What the INSTALLED system gets in /etc/apt/sources.list.d/ncz-base.sources.
# Deliberately NOT the build-time snapshot pin above. A snapshot Release
# carries a short Valid-Until (20260920T203924Z expires 2026-09-27T20:12:51Z),
# so a machine installed from that build starts refusing `apt update` days
# after it was handed over, on a system that worked when it shipped.
# Reproducibility is a property of the BUILD; a shipped system needs a live
# update path. Override only if you deliberately want installed machines
# frozen to an archive state.
NCZ_RUNTIME_MIRROR="${NCZ_RUNTIME_MIRROR:-https://deb.debian.org/debian}"
NCZ_RUNTIME_MIRROR_APT_OPTS="${NCZ_RUNTIME_MIRROR_APT_OPTS:-}"

# --- NCZ package revision defaults (single source for BOTH architectures) ---------------------
# build/lib/deb-version-gate.sh refuses to rebuild a package under a version that is already
# published with DIFFERENT content, and the rebuilt libdrm / DKMS debs are not byte-identical to
# the published ncz1 / +ncz1 ones (r201: libdrm-common 2.4.134-3+ncz1 Installed-Size 41 vs 43,
# panthor-cix-dkms 7.2.0+ncz1). The runner used to paper over that with LIBDRM_NCZ_REV=ncz2 and
# NCZ_DKMS_DEB_REV=2, and arm64 reused the r200 libdrm set, so a clean checkout could not build.
# The defaults live here so a clean checkout builds on amd64 AND arm64 with no environment:
#   NCZ_LIBDRM_NCZ_REV      libdrm suffix, "<src>-<deb>+<rev>"  (build/build-libdrm-debs.sh)
#   NCZ_DKMS_DEB_REV        "+ncz<N>" on cix-gpu-kmd-dkms, panthor-cix-dkms, cix-vpu-driver-dkms
#                           (build/build-dkms-debs.sh)
# BUMP RULE: raise the number whenever the published package of that name would differ in content:
# libdrm: the patch below, LIBDRM_SRC_VER/LIBDRM_DEB_REV, or the build toolchain (snapshot pin);
# DKMS: any change under assets/kernel/{mali,panthor,vpu}/ that reaches the deb. The two knobs bump
# together so the three DKMS debs and the arches stay on one revision. The libdrm patch hash is
# pinned so editing the patch without bumping fails the build instead of the version gate.
# The environment variables LIBDRM_NCZ_REV / NCZ_DKMS_DEB_REV still override (one-off rebuilds).
NCZ_LIBDRM_NCZ_REV="ncz2"
NCZ_LIBDRM_PATCH_SHA256="1c3eb930d7d8cc85d75a1184cb36564b779cae82fb92e3edb0bccd6b3510d214"
NCZ_DKMS_DEB_REV="${NCZ_DKMS_DEB_REV:-2}"
