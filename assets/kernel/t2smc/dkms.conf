PACKAGE_NAME="t2smc"
PACKAGE_VERSION="0.2"

# PACKAGE_VERSION tracks the vendored source content, not upstream tags.
# Rule: any change to src/** or patches/*.patch MUST bump PACKAGE_VERSION
# (monotonic) and record the new content identity in PROVENANCE. See
# PROVENANCE "Content-Identity Ledger" and tests/test_t2_pkgver_guard_20261114.py.

MAKE[0]="make KERNEL_SRC=/lib/modules/${kernelver}/build KERNEL_RELEASE=${kernelver}"

# Local hardening patches (see PROVENANCE and patches/). DKMS 3.2.2 (the
# version in the image) resolves each PATCH[] entry below a patches/
# directory next to the module source, so the value is the bare file name;
# a "patches/" prefix would make it look for patches/patches/.
# post-install/56-t2-dkms.sh copies assets/kernel/t2smc/patches/ into
# /usr/src/t2smc-0.2/ before dkms build.
# Patch numbers 0002 and 0004 are intentionally absent: upstream 8c7f725
# fixed both itself (see PROVENANCE, per-patch disposition).
PATCH[0]="0001-t2smc-range-checks.patch"
PATCH_MATCH[0]=".*"
PATCH[1]="0003-t2smc-cache-init.patch"
PATCH_MATCH[1]=".*"
PATCH[2]="0005-t2smc-telemetry-robust.patch"
PATCH_MATCH[2]=".*"

BUILT_MODULE_NAME[0]="t2smc"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
