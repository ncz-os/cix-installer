PACKAGE_NAME="t2smc"
PACKAGE_VERSION="0.1"

MAKE[0]="make KERNEL_SRC=/lib/modules/${kernelver}/build KERNEL_RELEASE=${kernelver}"

# Local hardening patch (see PROVENANCE and patches/). The path is relative to
# the DKMS source root (/usr/src/t2smc-0.1), which post-install/56-t2-dkms.sh
# populates from assets/kernel/t2smc/.
PATCH[0]="patches/0001-t2smc-range-checks.patch"
PATCH_MATCH[0]=".*"

BUILT_MODULE_NAME[0]="t2smc"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
