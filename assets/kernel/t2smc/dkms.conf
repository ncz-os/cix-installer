PACKAGE_NAME="t2smc"
PACKAGE_VERSION="0.1"

MAKE[0]="make KERNEL_SRC=/lib/modules/${kernelver}/build KERNEL_RELEASE=${kernelver}"

# Local hardening patch (see PROVENANCE and patches/). DKMS 3.2.2 (the version
# in the image) resolves each PATCH[] entry below a patches/ directory next to
# the module source, so the value is the bare file name; a "patches/" prefix
# would make it look for patches/patches/. post-install/56-t2-dkms.sh copies
# assets/kernel/t2smc/patches/ into /usr/src/t2smc-0.1/ before dkms build.
PATCH[0]="0001-t2smc-range-checks.patch"
PATCH_MATCH[0]=".*"

BUILT_MODULE_NAME[0]="t2smc"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
