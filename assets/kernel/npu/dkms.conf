# DKMS packaging for the CIX Sky1 NPU (Zhouyi v3) driver.
#
# Hand-written: unlike cix_opensource__gpu_kernel and cix_opensource__vpu_driver,
# the upstream cix_opensource__npu_driver repo ships no dkms.conf, so these build
# variables are transcribed from meta-cix cix-npu-kmd_1.0.bb do_compile. Keep the
# two in sync -- the BUILD_* selectors are not defaults, and getting them wrong
# yields a module that builds but targets the wrong NPU generation.
PACKAGE_NAME="cix-npu-kmd"
PACKAGE_VERSION="1.0"
AUTOINSTALL="yes"

_B="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"

MAKE[0]="make -C ${kernel_source_dir} M=${_B}/driver COMPASS_DRV_BTENVAR_KMD_VERSION=5.11.0 BUILD_AIPU_VERSION_KMD=BUILD_ZHOUYI_V3 BUILD_TARGET_PLATFORM_KMD=BUILD_PLATFORM_SKY1 BUILD_NPU_DEVFREQ=n KCFLAGS=-Wno-error modules"
CLEAN="make -C ${kernel_source_dir} M=${_B}/driver clean || true"

BUILT_MODULE_NAME[0]="aipu"
BUILT_MODULE_LOCATION[0]="driver"
DEST_MODULE_LOCATION[0]="/updates"
