PACKAGE_NAME="t2gmux"
PACKAGE_VERSION="0.9"

# PACKAGE_VERSION tracks the vendored MODULE_VERSION and bumps whenever
# the vendored content (src/** or patches/*.patch) changes. Rule: any
# content change MUST bump PACKAGE_VERSION (monotonic) and record the new
# content identity in PROVENANCE. See PROVENANCE "Content-Identity Ledger"
# and tests/test_t2_pkgver_guard_20261114.py.

MAKE[0]="make KDIR=/lib/modules/${kernelver}/build KVER=${kernelver}"

# Local hardening patches (see PROVENANCE and patches/).
PATCH[0]="0001-t2gmux-bounded-drain.patch"
PATCH_MATCH[0]=".*"
PATCH[1]="0002-t2gmux-pm-quiesce.patch"
PATCH_MATCH[1]=".*"
PATCH[2]="0003-t2gmux-error-recording.patch"
PATCH_MATCH[2]=".*"

BUILT_MODULE_NAME[0]="t2gmux"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
