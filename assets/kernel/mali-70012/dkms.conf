# DKMS package for the CIX Sky1 mali_kbase GPU driver, ported to the
# 7.0.12-cix-sky1-next (LTS / KVER_LTS) kernel tier.
#
# EXPERIMENTAL / OPT-IN — do NOT set AUTOINSTALL="yes". Unlike the shipping
# 7.2 (KVER_NEXT) mali stack, this package is NOT the default GPU driver for
# 7.0.12: panthor (in-tree) is validated + shipping there (see
# docs/DRIVER_FIDELITY_7012.md). This package builds clean and loads WITHOUT
# CRASHING at insmod (two real NULL-pointer-deref panics were root-caused
# and fixed — see patches/ for provenance).
#
# UPDATE 2026-07-27: the original perf-power-domain EPROBE_DEFER probe
# blocker IS fixed (meta-cix linux-cix-sky1-next kernel patches 2027+2028 —
# see README.md), and mali_kbase now probes much further. But that exposed
# a NEW, more serious bug: a real board crash (NULL IPA-model deref in
# sky1_power_model_work_handler, required a physical power-cycle to
# recover on O6N) once probe reaches kbase_platform_sky1_late_init(). A
# proposed fix exists (patches/candidate-untested/) but is NOT hardware-
# validated. DO NOT insmod this + the 2027/2028 kernel patches together
# without ALSO the candidate-untested guard, and DO NOT boot-test on real
# hardware without operator supervision — this exact combo already caused
# one hard lockup. Still NOT YET FUNCTIONAL as a GPU driver (/dev/mali0 has
# never been observed). Intended for A/B
# perf-test follow-up work, not production use. See task provenance in
# the commit history for this directory.
PACKAGE_NAME="cix-gpu-kmd-70012"
PACKAGE_VERSION="1.0.0"
CLEAN="make -C drivers/gpu/arm clean"
MAKE[0]="make -C drivers/gpu/arm all KDIR=${kernel_source_dir} KSRC=${kernel_source_dir} CIX_KERNEL_PATH=${kernel_source_dir} ARCH=arm64 CONFIG_MALI_MIDGARD=m CONFIG_MALI_CSF_SUPPORT=y CONFIG_MALI_GATOR_SUPPORT=y CONFIG_MALI_HAS_VIRTUALIZATION=n CONFIG_MALI_REAL_HW=y CONFIG_MALI_DEVFREQ=y CONFIG_MALI_MIDGARD_DVFS=n CONFIG_MALI_EXPERT=n CONFIG_LARGE_PAGE_SUPPORT=y CONFIG_MALI_NO_MALI=n CONFIG_MALI_DEBUG=n KCFLAGS=\"-DCONFIG_MALI_MIDGARD=1 -DCONFIG_MALI_CSF_SUPPORT=1 -DCONFIG_MALI_GATOR_SUPPORT=1 -DCONFIG_MALI_REAL_HW=1 -DCONFIG_MALI_DEVFREQ=1 -DCONFIG_LARGE_PAGE_SUPPORT=1 -DCONFIG_MALI_PLATFORM_NAME=\\\"sky1\\\"\""
BUILT_MODULE_NAME[0]="mali_kbase"
BUILT_MODULE_LOCATION[0]="drivers/gpu/arm/midgard/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="protected_memory_allocator"
BUILT_MODULE_LOCATION[1]="drivers/base/arm/protected_memory_allocator/"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="memory_group_manager"
BUILT_MODULE_LOCATION[2]="drivers/base/arm/memory_group_manager/"
DEST_MODULE_LOCATION[2]="/updates"
AUTOINSTALL="no"
