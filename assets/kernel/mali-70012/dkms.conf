# DKMS package for the CIX Sky1 mali_kbase GPU driver, ported to the
# 7.0.12-cix-sky1-next (legacy / KVER_LEGACY) kernel tier.
#
# EXPERIMENTAL / OPT-IN — do NOT set AUTOINSTALL="yes". Unlike the shipping
# 7.2 (KVER_NEXT) mali stack, this package is NOT the default GPU driver for
# 7.0.12: panthor (in-tree) is validated + shipping there (see
# docs/DRIVER_FIDELITY_7012.md). This package builds clean and loads WITHOUT
# CRASHING at insmod (two real NULL-pointer-deref panics were root-caused
# and fixed — see patches/ for provenance).
#
# UPDATE 2026-07-27: the original perf-power-domain EPROBE_DEFER probe
# blocker IS fixed (meta-cix linux-cix-sky1-next kernel patches 2027+2028 —
# see README.md), and mali_kbase now probes much further. Crash #1 (NULL
# IPA-model deref in sky1_power_model_work_handler) is FIXED and hardware-
# validated (patches/0002-..., applied to src/). Crash #2 (NULL deref in
# devfreq's clk_round_rate, hit immediately after #1 was fixed) is NOT yet
# fixed — real board panic, auto-recovered via panic=30 that one time but
# not guaranteed to. DO NOT boot-test this combo on real hardware without
# operator supervision. Still NOT YET FUNCTIONAL as a GPU driver (/dev/mali0
# has never been observed). Intended for A/B perf-test follow-up work, not
# production use. See task provenance in the commit history for this
# directory, and README.md for full crash-by-crash detail.
#
# NOTE: MAKE[0] alone only builds mali_kbase.ko — the wrapper Makefile does
# NOT recurse into the sibling base/arm helper module dirs. MAKE[1]/MAKE[2]
# build those explicitly (each needs its own CONFIG_MALI_*=y gate in its
# Kbuild, and an explicit -I to this package's own include/ for
# <linux/protected_memory_allocator.h> etc., which isn't a real kernel
# header). Confirmed via real build 2026-07-27 — without these, `dkms
# build` silently produces only 1 of the 3 BUILT_MODULE_NAME entries.
PACKAGE_NAME="cix-gpu-kmd-70012"
PACKAGE_VERSION="1.0.0"
CLEAN="make -C drivers/gpu/arm clean"
MAKE[0]="make -C drivers/gpu/arm all KDIR=${kernel_source_dir} KSRC=${kernel_source_dir} CIX_KERNEL_PATH=${kernel_source_dir} ARCH=arm64 CONFIG_MALI_PLATFORM_NAME=sky1 CONFIG_MALI_MIDGARD=m CONFIG_MALI_CSF_SUPPORT=y CONFIG_MALI_GATOR_SUPPORT=y CONFIG_MALI_HAS_VIRTUALIZATION=n CONFIG_MALI_REAL_HW=y CONFIG_MALI_DEVFREQ=y CONFIG_MALI_MIDGARD_DVFS=n CONFIG_MALI_EXPERT=n CONFIG_LARGE_PAGE_SUPPORT=y CONFIG_MALI_NO_MALI=n CONFIG_MALI_DEBUG=n KCFLAGS=\"-DCONFIG_MALI_MIDGARD=1 -DCONFIG_MALI_CSF_SUPPORT=1 -DCONFIG_MALI_GATOR_SUPPORT=1 -DCONFIG_MALI_REAL_HW=1 -DCONFIG_MALI_DEVFREQ=1 -DCONFIG_LARGE_PAGE_SUPPORT=1 -DCONFIG_MALI_PLATFORM_NAME=\\\"sky1\\\"\""
MAKE[1]="make -C ${kernel_source_dir} M=$(pwd)/drivers/base/arm/protected_memory_allocator CONFIG_MALI_PROTECTED_MEMORY_ALLOCATOR=y KCFLAGS=\"-I$(pwd)/include\" modules"
MAKE[2]="make -C ${kernel_source_dir} M=$(pwd)/drivers/base/arm/memory_group_manager CONFIG_MALI_MEMORY_GROUP_MANAGER=y KCFLAGS=\"-I$(pwd)/include\" modules"
BUILT_MODULE_NAME[0]="mali_kbase"
BUILT_MODULE_LOCATION[0]="drivers/gpu/arm/midgard/"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="protected_memory_allocator"
BUILT_MODULE_LOCATION[1]="drivers/base/arm/protected_memory_allocator/"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="memory_group_manager"
BUILT_MODULE_LOCATION[2]="drivers/base/arm/memory_group_manager/"
DEST_MODULE_LOCATION[2]="/updates"
AUTOINSTALL="no"
