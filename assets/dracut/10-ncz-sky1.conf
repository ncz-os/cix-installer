# Sky1 initrd driver set for dracut.
#
# MEASURED on O6N 2026-08-15, not guessed. A stock `dracut --no-hostonly` image
# omits 24 modules that initramfs-tools ships, and the module COUNTS MATCH
# (45 vs 45) -- so a superficial comparison reads as equivalent when it is not.
#
# The omission that matters most is linlon-dp: it is the ONLY video console on
# the O6N. An initrd without it is a permanent black screen, the same failure
# class already paid for once when pruning d-i initrd modules. The USB-ethernet
# set is the other one: losing it removes a network recovery path on a headless
# board, which cuts against the lockout-recovery policy (telnet :23 +
# ncz-failsafe busybox console).
#
# With this list, `comm -23` against the initramfs-tools module set returns
# ZERO missing modules (69 vs 45; the extras are hostonly bloat, kept because a
# superset that definitely boots beats a lean image that might not).

add_drivers+=" linlon-dp trilin-dpsub drm_dma_helper drm_kms_helper drm_display_helper drm_client_lib drm_dp_aux_bus cec pwm_bl msm "
add_drivers+=" asix ax88179_178a ax88796b cdc_ether cdc_ncm lan78xx r8152 r8153_ecm smsc95xx smsc usbnet mii phylink microchip "

# Generic, not host-only: a shipped image must boot on any Sky1 board, not just
# the one that built it.
hostonly="no"

# Headless-safe failure behaviour. MEASURED: under KVM with no root device,
# initramfs-tools panics and reboots, but dracut stops at a sulogin prompt
# ("Cannot open access to console, the root account is locked. Press Enter to
# continue") and waits forever. On a headless board that is an indefinite hang
# with no console to answer it. Force a bounded failure instead.
kernel_cmdline+=" rd.shell=0 rd.emergency=reboot rd.timeout=30 "
