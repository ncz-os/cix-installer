# NCZ-OS 26.10 Cygnus rEFInd theme.
# Paths are relative to the rEFInd directory (EFI/BOOT). Included from the end
# of refind.conf, so these lines override the generated banner lines.
#
# Deterministic across firmware GOP modes: a single 1920x1080 background drawn
# with banner_scale fillscreen. rEFInd scales the banner to the exact screen
# size (libeg/image.c egScaleImage -> refind/screen.c BANNER_FILLSCREEN), so it
# fills every mode with no crop. The DRM connector mode is deliberately NOT
# consulted: the OS cannot read the GOP mode the firmware actually gave rEFInd,
# and picking a panel-sized background made rEFInd crop it (O6N has a 4K panel
# but a ~1920-wide GOP mode, so a noscale 3840x2160 image showed only its
# centre). On a non-16:9 GOP (a T2 Mac's 16:10) the uniform aspect stretch is
# accepted: at 16:10 it is 11% vertical, versus a hard error screen or a crop
# for the alternatives (see docs/REFIND-THEME.md).
banner themes/cygnus/background-1920x1080.png
banner_scale fillscreen
selection_big themes/cygnus/selection_big.png
selection_small themes/cygnus/selection_small.png
