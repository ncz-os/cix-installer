# /etc/ncz/console-saver.conf -- Magnetar Server console screen saver.
# Every key is required to be well-formed; a typo fails the service rather
# than silently falling back to defaults.
#
# enabled       1 = watch idleness and run the saver (0 = off)
# idle_seconds  seconds of console idleness before the saver arms (1..86400)
# grid          auto = the target VT's own size (stty size), or COLSxROWS
# colour        auto = detect from $TERM, or 16 | 256 | 24
# scene         blackhole (the console currently has one scene)
# max_failures  saver crashes tolerated before staying off and logging once

enabled = 1
idle_seconds = 180
grid = auto
colour = auto
scene = blackhole
max_failures = 3
