<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Firefox NCZ Sky1 Edition.

       Same NCZ "Maximilian" black hole as the Chromium NCZ mark - black event
       horizon, hot coral photon ring, amber accretion material - but the disc
       is wound into three tapering streamers rather than Chromium's three
       straight segments. The two icons read as one family and as two
       different browsers, and neither borrows Mozilla's or Google's mark. -->
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5A3C"/><stop offset="100%" stop-color="#F2A860"/>
    </linearGradient>
    <linearGradient id="s2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8402A"/><stop offset="100%" stop-color="#E8934F"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C22A1E"/><stop offset="100%" stop-color="#FF7A4D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="70%" stop-color="#FF5A3C" stop-opacity="0"/>
      <stop offset="90%" stop-color="#FF5A3C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF5A3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

