<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Firefox NCZ Sky1 Edition.

       The Gargantua read from the NCZ "Maximilian" wallpaper: an accretion
       disc seen nearly edge-on, with the arc of lensed light bent over the
       pole. Chosen specifically so the silhouette - horizontal bar plus arch -
       cannot be mistaken for the Chromium NCZ mark's three-segment donut at
       16px. Hue runs crimson where Chromium runs amber, for a second axis of
       separation. Shares the palette and the black event horizon, so the two
       still read as one family. -->
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A150E" stop-opacity="0.2"/>
      <stop offset="20%"  stop-color="#D93A22"/>
      <stop offset="50%"  stop-color="#FF6A3C"/>
      <stop offset="80%"  stop-color="#D93A22"/>
      <stop offset="100%" stop-color="#7A150E" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A150E" stop-opacity="0.2"/>
      <stop offset="20%"  stop-color="#FF7A4D"/>
      <stop offset="50%"  stop-color="#FFA366"/>
      <stop offset="80%"  stop-color="#FF7A4D"/>
      <stop offset="100%" stop-color="#7A150E" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C22A1E" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FFB07A"/>
      <stop offset="70%"  stop-color="#FFB07A"/>
      <stop offset="100%" stop-color="#C22A1E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="82%"  stop-color="#FF4A2A" stop-opacity="0"/>
      <stop offset="96%"  stop-color="#FF4A2A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF4A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>

