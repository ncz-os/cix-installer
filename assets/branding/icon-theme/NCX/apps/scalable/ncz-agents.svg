<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black hole background -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0a" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Accretion disk glow -->
  <ellipse cx="32" cy="38" rx="22" ry="6" fill="none" stroke="#4a9eff" stroke-width="2" opacity="0.6"/>
  <ellipse cx="32" cy="37" rx="18" ry="4" fill="none" stroke="#7bb8ff" stroke-width="1.5" opacity="0.4"/>
  <!-- NCZ letterform in white -->
  <text x="32" y="34" font-family="monospace" font-size="18" font-weight="bold"
        fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">NCZ</text>
  <!-- Event horizon shadow -->
  <circle cx="32" cy="32" r="10" fill="#0a0a0a" opacity="0.7"/>
  <!-- Star core -->
  <circle cx="32" cy="32" r="4" fill="#e8f4ff" opacity="0.9"/>
  <circle cx="32" cy="32" r="2" fill="white"/>
</svg>
