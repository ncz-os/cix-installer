# Retention rules for tools/gitlab-registry-cleanup.sh (generic packages).
# PROJECT  PACKAGE  VERSION-REGEX  KEEP  DEDUPE
#
# Release images: the newest two versions stay (any version a release still
# links to stays as well); one file per name inside each version.
ncz-os/cix-installer  ncz-os-image   .                             2    yes
#
# zoder nightly channel: "master" is the rolling latest build and always
# stays; dated (YYYY-MM-DD) and per-run (run-*) versions keep the newest 14
# each. Older copies of a file name inside a kept version are removed.
ncz-os/zoder          zoder-nightly  ^master$                      all  yes
ncz-os/zoder          zoder-nightly  ^[0-9]{4}-[0-9]{2}-[0-9]{2}$  14   yes
ncz-os/zoder          zoder-nightly  ^run-                         14   yes
#
# Not listed, so never touched: kernel source and pristine-base tarballs
# (linux-source-*, linux-pristine-base-*), which are the corresponding source
# for kernels in distributed images (docs/SOURCE-RELEASES.md).
