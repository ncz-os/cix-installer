# DKMS packaging for the CIX Sky1 Mali-G720 GPU driver (7.2 tier).
#
# Mirrors meta-cix/recipes-kernel/cix-modules/cix-gpu-kmd_1.0.bb do_compile:
# gpu.mk is an Android-product makefile, so map its TARGET_*/CIX_* variables
# onto the on-target kernel build tree.
#
# LOCALVERSION is deliberately NOT passed here. The recipe has to pass it
# because Yocto keeps it out-of-band, but on target the suffix comes from the
# localversion-* file that post-install/79-dkms-prep.sh writes into the build
# tree, so kbuild derives the release string itself. Hardcoding a release
# string is the exact bug that shipped rc5 modules onto an rc6 kernel.
PACKAGE_NAME="cix-gpu-kmd"
PACKAGE_VERSION="1.0"
AUTOINSTALL="yes"

_B="${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build"

MAKE[0]="make -f gpu.mk gpu CIX_GPU_PATH=${_B} CIX_KERNEL_PATH=${kernel_source_dir} KERNEL_OUT=${kernel_source_dir} TARGET_OUT_INTERMEDIATES=${_B}/out TARGET_KERNEL_ARCH=arm64 ARCH=arm64 KDIR=${kernel_source_dir} KSRC=${kernel_source_dir} KERNEL_SRC=${kernel_source_dir} hide= clean_build=0"
CLEAN="make -f gpu.mk clean CIX_GPU_PATH=${_B} TARGET_OUT_INTERMEDIATES=${_B}/out || true"

BUILT_MODULE_NAME[0]="mali_kbase"
BUILT_MODULE_LOCATION[0]="out/GPU_OBJ"
DEST_MODULE_LOCATION[0]="/updates"
BUILT_MODULE_NAME[1]="memory_group_manager"
BUILT_MODULE_LOCATION[1]="out/GPU_OBJ"
DEST_MODULE_LOCATION[1]="/updates"
BUILT_MODULE_NAME[2]="protected_memory_allocator"
BUILT_MODULE_LOCATION[2]="out/GPU_OBJ"
DEST_MODULE_LOCATION[2]="/updates"
