# Only the default branch (and the recovery branch) deploy the APT repo to
# Pages. Tag pushes (v26.6*) must NOT create a pipeline — nothing here runs on
# tags, and an empty pipeline is reported as "failed".
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "recovery/26.6-take1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

pages:
  stage: deploy
  script:
    # We must assume the runner has the .debs available as artifacts from an earlier stage
    # or they are downloaded here from a remote object store (e.g. S3 or GitLab Package Registry)
    # since we cannot store 250MB+ of binary blobs in the git repository itself.
    - echo "Deploying APT repo to GitLab pages..."
    - mkdir -p public/pool/main
    - mkdir -p public/dists/forky/main/binary-arm64
    # Heredoc must live inside a single block-scalar step; bare column-0 lines
    # would be parsed as top-level YAML keys and break the job definition.
    - |
      cat > public/dists/forky/Release << "REL"
      Origin: NCZ
      Label: NCZ
      Suite: forky
      Codename: forky
      Architectures: arm64
      Components: main
      Description: NCZ Magnetar CIX Repository
      REL
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "recovery/26.6-take1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Automatic substrate CI, stage 0 (design: docs/automatic-substrate-ci.md).
# Scheduled only: it probes the pinned snapshot and reports whether moving the
# pin would be safe.  Read-only -- no branch, no commit, no merge.  A degraded
# mirror intentionally exits 0 (alert, not a failed pipeline): the pipeline
# failing every time Debian has a bad morning is how alerts get ignored.
# ---------------------------------------------------------------------------
substrate-ci:preflight:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    # The driver reads release.conf itself and refuses any stage that would move a
    # pin without --apply, so the scheduled job cannot change the substrate by accident.
    - bash build/substrate-ci.sh --stage preflight --json
  artifacts:
    when: always
