# Install as: /etc/systemd/system/ncz-nightly-canary.service.d/10-host.conf
# Host ULTRA (192.168.207.88) — arm64 build host, runs the arm64 build inside a
# rolling container.  Kernel staging lives on the shared ARGONAS export spelled
# /mnt/argonas-yocto-shared here (ACHILLES/HYDRA use /mnt/argonas/datapool/yocto-shared).
[Service]
Environment=NCZ_NIGHTLY_ARCH=arm64
Environment=NCZ_ARM64_KERNEL_TREE=/opt/ncz/kernel/linux-cix-sky1-ncz
# ULTRA's kernel-staging pool spelling (build-image.sh handles both).
Environment=NCZ_KERNEL_STAGING_ROOT=/mnt/argonas-yocto-shared
Environment=NCZ_IMAGEBUILD_TAG=localhost/ncz-imagebuild:trixie
