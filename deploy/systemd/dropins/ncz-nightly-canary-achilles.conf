# Install as: /etc/systemd/system/ncz-nightly-canary.service.d/10-host.conf
# Host ACHILLES (192.168.207.11) — amd64 build host (native; no container needed
# for the amd64 kernel staging, but the singularity payload still builds in the
# debian:forky container).
[Service]
Environment=NCZ_NIGHTLY_ARCH=amd64
# Kernel tree for the nightly patch-applicability check (a local clone of the
# T2/amd64 kernel tree).  Leave unset to fall back to ls-remote HEAD resolution
# (patch check then reports HEAD-ONLY).
Environment=NCZ_AMD64_KERNEL_TREE=/opt/ncz/kernel/amd64-kernel-t2
# The heavy payload build needs the pinned ncz-imagebuild container present.
Environment=NCZ_IMAGEBUILD_TAG=localhost/ncz-imagebuild:trixie
