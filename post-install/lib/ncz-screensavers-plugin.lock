# ncz-screensavers-plugin.lock -- the pinned Singularity "Screensaver and
# Lockscreen" settings plugin that every desktop image ships (since
# 2026-10-06). Shell-sourceable KEY=VALUE, no command substitution.
#
# One file, read by every consumer, so the pin cannot drift between them:
#   build/stage-screensaver-plugin.sh   copies the deb from the artifact store into
#                                       build/ncz-screensavers-out/ (sha256 checked)
#   build/check-ssplugin-abi.sh         stage-2 gate: staged deb == pin, and the
#                                       image's Singularity payload is the one the
#                                       plugin was linked against (ABI guard)
#   build/iso/write-usb-image.py        puts the pinned deb on the install medium
#                                       (ncz-payload/assets/ncz-screensavers-plugin/)
#   post-install/lib/ncz-ssplugin-install.sh (from hook 59) installs it offline
#   build/verify-installed-target-screensavers*.sh  installed-target gate
#   build/verify-dual-arch-parity.sh    both arches pinned, one source commit
#   build/gen-components-registry.py    the registry row
# Rebuild commands: ssplugin_rebuild_help in post-install/lib/ncz-ssplugin-install.sh.
#
# The plugin links libsingularity.so.0 from the Singularity payload
# (ncz-singularity-desktop). A plugin is only installed on top of a payload
# whose version equals NCZ_SSPLUGIN_PAYLOAD_<arch>, or whose libsingularity
# (the only Singularity library the plugin links) is byte-identical to
# NCZ_SSPLUGIN_LIBSINGULARITY_SHA256_<arch>. Anything else means: rebuild the
# plugin against the new payload, restage it in the artifact store, update this file.
NCZ_SSPLUGIN_PKG=ncz-screensavers-plugin
NCZ_SSPLUGIN_VERSION=0.3.22
NCZ_SSPLUGIN_MAINTAINER="Jason Perlow <jperlow@gmail.com>"
# Directory under the artifact-store projects root (mount point differs per
# build host; see build/stage-screensaver-plugin.sh).
NCZ_SSPLUGIN_STORE_DIR=ncz-screensavers-debs/plugin-0.3.22-20261013
NCZ_SSPLUGIN_SOURCE="ncz-screensavers master 4a289f6a4c7c2d64f952ade5aa9378abbc1dee8e"
NCZ_SSPLUGIN_SHA256_amd64=964bb8eef10c342147b0ed04a62df49fc4f78f3cfa72d36d6cf53b455d911caa
NCZ_SSPLUGIN_SHA256_arm64=73bc17a7f91655d791f71f7caf89965c483fe468b2095ff876ff7f3c86ecd2e7
NCZ_SSPLUGIN_PAYLOAD_amd64=20261013233000+bk0+tgzef364e5b
NCZ_SSPLUGIN_PAYLOAD_arm64=20261013233000+bk0+tgz03b581f4
NCZ_SSPLUGIN_ABI_LIB=/opt/singularity/lib/libsingularity.so.0
NCZ_SSPLUGIN_LIBSINGULARITY_SHA256_amd64=aa97ef0a113408b0945778a3d1b8476713b23682a480bfa58228617b698000d6
NCZ_SSPLUGIN_LIBSINGULARITY_SHA256_arm64=2da0aeb5acd132929c201ac8bc13dd163accabb6ce0d5dcff121a43d83d52af3
