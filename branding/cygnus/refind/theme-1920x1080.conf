# NCZ-OS 26.10 Cygnus rEFInd theme, 1920x1080 background.
# Paths are relative to the rEFInd directory (EFI/BOOT). Included from the
# end of refind.conf, so these lines override the generated banner lines.
banner themes/cygnus/background-1920x1080.png
banner_scale noscale
selection_big themes/cygnus/selection_big.png
selection_small themes/cygnus/selection_small.png
