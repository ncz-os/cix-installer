# CRITICAL (codex r26 review): d-i base-installer in CD mode honors
# cdrom/suite + cdrom/codename, NOT mirror/codename, when picking which
# dists/<suite>/ to bootstrap from. Without these, cdebootstrap targets
# bookworm (the bookworm dists/ tree we kept for udebs) instead of the
# real target suite.
# r180: resolute -> forky (2026-09-24). base.squashfs is real Debian
# forky content (confirmed via build-squashfs-layers.sh's own r164/
# 2026-08-17 incident notes: "resolute" leaking through here previously
# caused a real build failure looking for a nonexistent
# rootfs-resolute-*.tar.zst -- forky is the actual, current suite name
# throughout this pipeline).
d-i cdrom/suite string forky
