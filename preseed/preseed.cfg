# preseed.cfg — nclawzero unattended install via bookworm d-i (NCZ-OS 26.7 / Debian forky target)
#
# HISTORICAL FILE: written in the Ubuntu-resolute era (r17-r49); the live
# pipeline build-iso-di.sh (~line 2335) still copies this file in as a
# TEMPLATE and rewrites suite/codename/mirror/hotname to match release.conf
# (NCZ_BASE_MIRROR + NCZ_BASE_CODENAME) on every build, so the produced ISO
# targets NCZ_BASE_CODENAME (Debian forky on 26.7) regardless of what the
# raw mirror lines below say. Do NOT edit mirror lines by hand — edit
# release.conf or the sed pass in build-iso-di.sh.
#
# d-i provides the installer (busybox initrd, debootstrap, apt-setup); the
# installed system is retargeted at build time via the sed pass above.

##############################################################################
# Localization — native d-i prompts
#
# Leave debian-installer/locale and keyboard-configuration/* unanswered here.
# localechooser and keyboard-configuration intentionally raise their own
# questions to critical priority, so real installs get Debian's upstream
# language/country/locale and layout/variant dialogs even under priority=critical.
# The unattended KVM gate patches a throwaway qemutest ISO with gate-only
# preseed answers; do not add fallback values here or mark these questions seen.
##############################################################################

##############################################################################
# Network — DHCP, fully automatic, retry forever.
##############################################################################
d-i netcfg/choose_interface select auto
d-i netcfg/choose_interface seen true
# r177: hostname is a PLACEHOLDER only (seen -> d-i NEVER prompts for it). The
# installed system's real hostname is auto-derived per-machine as ncz-<mac6>
# (last 6 hex of the primary ethernet MAC) by the ncz-firstboot oneshot on first
# boot, where the real hardware MAC is authoritative. The operator-facing
# interactive prompt is the USERNAME (see passwd/* below), NOT the hostname.
d-i netcfg/get_hostname string ncz-setup
d-i netcfg/get_hostname seen true
d-i netcfg/hostname string ncz-setup
d-i netcfg/hostname seen true
d-i netcfg/get_domain string nclawzero.lan
d-i netcfg/get_domain seen true
d-i netcfg/wireless_wep string
# 2026-05-07 take10: fallback nameservers. DHCP-provided DNS overrides this
# when present, but if the LAN router's DNS is flaky/overloaded mid-install
# (observed when a single upstream resolver dropped queries during pkgsel +
# grub-package fetch), apt falls through to these public resolvers. Network-
# neutral: no site-specific gateway baked in.
d-i netcfg/get_nameservers string 8.8.8.8 1.1.1.1
d-i netcfg/get_nameservers seen true

d-i netcfg/disable_autoconfig boolean false
d-i netcfg/disable_autoconfig seen true
d-i netcfg/link_wait_timeout string 60
d-i netcfg/link_wait_timeout seen true
d-i netcfg/link_detection_timeout string 60
d-i netcfg/link_detection_timeout seen true
d-i netcfg/dhcp_timeout string 120
d-i netcfg/dhcp_timeout seen true
d-i netcfg/dhcpv6_timeout string 120
d-i netcfg/dhcpv6_timeout seen true
d-i netcfg/dhcp_failed note
# r178: a fully OFFLINE install (baked squashfs, no reachable mirror) must not
# stall if DHCP assigns an address but sets NO default route (isolated LAN / no
# gateway). Without this, netcfg raises "[!!] Configure the network — Continue
# without a default route?" and blocks the unattended flow. Auto-continue (Yes):
# the install needs no Internet — everything is on the media.
d-i netcfg/no_default_route boolean true
d-i netcfg/no_default_route seen true
# r79: do NOT auto-retry forever on no-link. Previously dhcp_options was
# preseeded + marked seen, so a missing Ethernet carrier looped silently
# with no actionable message (worst on Orion O6, whose real issue was the
# now-shipped rtl_nic firmware). Leaving dhcp_options unset makes d-i stop
# on its standard "Network autoconfiguration failed" note so the operator
# can plug in a wired cable and Retry once — wired link is required.

##############################################################################
# anna: skip the "No kernel modules were found" critical prompt.
##############################################################################
d-i anna/no_kernel_modules boolean true
d-i anna/no_kernel_modules seen true

##############################################################################
# Network-console — SSH for live remote diagnostics during install
#
# Three layers of in-install diagnostic access:
#
#  1. installer@<host> via password "diags" — d-i curses menu.
#     Default for unattended ops; works on any client without keys.
#  2. root@<host> via fleet pubkey — direct shell, no curses menu.
#     For scripted recovery when the install bombs at a stage that
#     blocks the curses menu (e.g. anna stalls before menu spawn).
#     Wired up by the early_command below.
#  3. magnetar@<host> via fleet pubkey or password "diags" —
#     persistent post-install diag user. See post-install/09-diag-account.sh
#     (TESTING ONLY — remove before public ship).
#
# All three exist for one reason: a remote operator must always have at
# least one working credential against this box, regardless of what stage
# of install bombed.
##############################################################################
# network-console is NO LONGER forced here. Loading it makes d-i run its whole
# UI over SSH: the local screen gets the branded background and nothing else,
# which reads as "the installer has no video" to anyone sitting at the machine.
# Measured on O6N 2026-08-13 with r229 -- console=tty0 only, no serial in
# /proc/cmdline, display stack provably fine (writes to /dev/tty1 and
# /dev/console both appeared on the monitor) -- and the screen still showed
# only the NCZ INSTALLER branding because the menu was being served to
# ssh installer@<host>.
#
# The DIAG boot entry passes these on the kernel cmdline instead, so a headless
# or remote install still gets the network console on demand. The credentials
# below stay preseeded so that path needs no interaction when it IS requested.
#
# Root SSH no longer depends on loading network-console: diag-console.sh
# installs openssh-server-udeb directly, writes a minimal diag-owned sshd_config,
# and starts root-capable sshd without handing the local d-i UI to
# network-console. The DIAG boot entry may still request network-console for its
# own serial/headless workflow; the normal install path keeps local video.
d-i network-console/password password diags
d-i network-console/password seen true
d-i network-console/password-again password diags
d-i network-console/password-again seen true
d-i network-console/start select Continue
d-i network-console/start seen true

##############################################################################
# preseed/early_command — runs ASAP after preseed loads.
#
# Seed fleet authorized_keys for root in the d-i ramdisk so a remote
# operator can SSH `root@<host>` directly during install (bypassing the
# network-console curses menu wrapper that scripts can't drive).
#
# 2026-05-07 (Codex r78 audit): early_command runs IMMEDIATELY after
# preseed loads, BEFORE network-console installs the openssh-server udeb.
# So patching /etc/ssh/sshd_config inline here is a no-op — sshd_config
# doesn't exist yet. Workaround: write authorized_keys + sentinel now,
# then spawn a background watcher that polls for sshd_config + a running
# sshd, and patches PermitRootLogin yes only once sshd is actually up.
#
# d-i busybox initrd does NOT ship `nohup`. Bare `&` is sufficient: the
# orphaned watcher gets reparented to init and survives early_command's
# exit. Redirecting stdin/stdout/stderr to /dev/null on the line below
# detaches the watcher cleanly.
#
# 2026-08-24: every backgrounded helper ALSO closes fds 3-6 (3>&- 4>&- 5>&-
# 6>&-). In this postinst context fd3 is the WRITE end of cdebconf's command
# pipe and fds 4-6 are dups of main-menu's original stdio. A long-lived
# orphan (watcher, diag sshd and every ssh session it spawns) holding fd3
# open means cdebconf NEVER sees EOF on its command pipe after main-menu
# exits, so any installer crash turns into a silent eternal wedge on a blank
# screen instead of d-i's loud "installer step failed" recovery path —
# measured live on .66 during the 2026-08-24 "Cannot find \"ok\" in menu"
# forensics, where the debconf frontend sat in anon_pipe_read held open only
# by the diag sshd chain. Closing the fds also makes it impossible for any
# future backgrounded helper to inject confmodule commands whose replies
# nobody reads (the root cause of that same wedge, see
# component-selector.sh).
#
# Both fleet keys go in: jperlow@work-laptop + argos-backup. Same key
# set 35-ssh.sh and 09-diag-account.sh use post-install — symmetry on
# purpose, so the same SSH client config Just Works at every stage.
#
# r196c: netcfg/choose_interface=auto is NOT carrier-aware — on boards with
# multiple NICs where one port has no cable routed to it (Orion O6N:
# enp1s0 dead, enp49s0 live), auto can still land on the dead port and
# DHCPDISCOVER then spins forever with zero wire traffic (no link_wait_
# timeout note is ever raised because the interface exists, it just has no
# carrier). Fixed at the end of this same early_command: administratively
# raise every NIC first, then poll /sys/class/net/*/carrier in parallel for
# up to 25s (RTL8125B autoneg takes ~9-13s) and db_set
# netcfg/choose_interface to whichever NIC actually has carrier=1 before
# netcfg runs. Raising the NICs is required: Linux does not report carrier
# for an interface that is still administratively down. Falls back to auto
# if nothing gets carrier in time.
##############################################################################
d-i preseed/early_command string \
    set +e ; \
    NCZREV=$(for t in $(cat /proc/cmdline); do case $t in ncz_rev=*) echo ${t#ncz_rev=};; esac; done) ; for V in /dev/tty1 /dev/tty2 /dev/tty3 /dev/tty4; do echo "==== NCZ-OS INSTALLER ${NCZREV:-?} ====" > $V 2>/dev/null || true; done ; \
    NCZSRC=/cdrom/cixmini ; while read _d _mp _r ; do [ -f "$_mp/cixmini/busybox-arm64" ] && NCZSRC="$_mp/cixmini" && break ; done < /proc/mounts ; \
    mkdir -p /root/.ssh && chmod 0700 /root/.ssh ; \
    printf '%s\n' \
        '# nclawzero fleet diag keys (auto-injected by preseed early_command)' \
        'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBJ3z+8UX2oPt3cmN1X9XU8RWrgp7VvdHPd0vW+m/AoR jperlow@work-laptop' \
        'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHKCDT5Busd1J+j4kpzkZ/jT/GtUQylaZCUCTftY2sYk argos-backup' \
        > /root/.ssh/authorized_keys ; \
    chmod 0600 /root/.ssh/authorized_keys ; \
    date -u +"early_command-fired %FT%TZ" > /etc/early_command_ran.txt ; \
    ls -la /root/.ssh /etc/early_command_ran.txt > /var/log/early_command.log 2>&1 ; \
    cp "$NCZSRC/sshd-watcher.sh" /tmp/sshd-watcher.sh 2>>/var/log/early_command.log ; \
    chmod +x /tmp/sshd-watcher.sh ; \
    /tmp/sshd-watcher.sh </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- & \
    mkdir -p /tmp/nczdiag ; \
    cp "$NCZSRC/busybox-arm64" /tmp/nczdiag/busybox 2>>/var/log/early_command.log ; \
    chmod +x /tmp/nczdiag/busybox 2>>/var/log/early_command.log ; \
    cp "$NCZSRC/diag-console.sh" /tmp/diag-console.sh 2>>/var/log/early_command.log ; \
    chmod +x /tmp/diag-console.sh ; \
    /tmp/diag-console.sh </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- & \
    for V in /dev/tty1 /dev/tty3; do echo "[ncz] Detecting storage/USB devices, please wait..." > $V 2>/dev/null || true; done ; \
    cp "$NCZSRC/usb-rescan.sh" /tmp/usb-rescan.sh 2>>/var/log/early_command.log ; \
    chmod +x /tmp/usb-rescan.sh ; \
    /tmp/usb-rescan.sh </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- ; \
    if [ ! -e /usr/share/debootstrap/scripts/resolute ]; then \
        ln -sf gutsy /usr/share/debootstrap/scripts/resolute 2>>/var/log/early_command.log ; \
        echo "early_command: linked resolute -> gutsy" >> /var/log/early_command.log ; \
    fi ; \
    { . /usr/share/debconf/confmodule 2>/dev/null || . /usr/lib/cdebconf/confmodule 2>/dev/null || true ; } ; \
    PICKED_IF="" ; \
    for _if in /sys/class/net/*; do \
        _ifn=$(basename "$_if") ; \
        [ "$_ifn" = "lo" ] && continue ; \
        ip link set dev "$_ifn" up 2>>/var/log/early_command.log || true ; \
    done ; \
    for _i in $(seq 1 25); do \
        for _if in /sys/class/net/*; do \
            _ifn=$(basename "$_if") ; \
            [ "$_ifn" = "lo" ] && continue ; \
            [ -f "$_if/carrier" ] || continue ; \
            [ "$(cat "$_if/carrier" 2>/dev/null)" = "1" ] && PICKED_IF="$_ifn" && break 2 ; \
        done ; \
        for V in /dev/tty1 /dev/tty3; do echo "[ncz] Waiting for network link... (${_i}s/25s)" > $V 2>/dev/null || true; done ; \
        sleep 1 ; \
    done ; \
    if [ -n "$PICKED_IF" ] && command -v db_set >/dev/null 2>&1 ; then \
        echo "early_command: carrier detected on $PICKED_IF after $_i s, forcing netcfg/choose_interface" >> /var/log/early_command.log ; \
        db_set netcfg/choose_interface "$PICKED_IF" ; \
        db_fset netcfg/choose_interface seen true ; \
    else \
        echo "early_command: no carrier on any NIC after 25s (PICKED_IF=$PICKED_IF, db_set=$(command -v db_set)), leaving netcfg/choose_interface=auto" >> /var/log/early_command.log ; \
    fi ; \
    cp "$NCZSRC/component-selector.sh" /tmp/component-selector.sh 2>>/var/log/early_command.log ; \
    chmod +x /tmp/component-selector.sh 2>>/var/log/early_command.log ; \
    sh /tmp/component-selector.sh >>/var/log/early_command.log 2>&1 ; \
    true
d-i preseed/early_command seen true

##############################################################################
# Mirror — OFFLINE, embedded on the ISO at /pool + /dists/resolute
#
# r26: ISO embeds a curated resolute arm64 mirror (~5-8 GB) at the root.
# d-i's cdebootstrap reads our generated Release file from /cdrom/dists/
# resolute/Release — codename "resolute" doesn't need to be hardcoded in
# cdebootstrap, it just trusts the Release file.
#
# Result: ZERO network dependency during install. Idiot-proof.
##############################################################################
d-i mirror/protocol string http
d-i mirror/protocol seen true
d-i mirror/country string manual
d-i mirror/country seen true
d-i mirror/http/hostname string ports.ubuntu.com
d-i mirror/http/hostname seen true
d-i mirror/http/directory string /ubuntu-ports
d-i mirror/http/directory seen true
d-i mirror/http/proxy string
d-i mirror/http/suite string resolute
d-i mirror/http/suite seen true
d-i mirror/codename string resolute
d-i mirror/codename seen true
d-i mirror/suite string resolute
d-i mirror/suite seen true

# r31+ ARCHITECTURE: ONE suite (resolute) for both regular debs AND udebs.
# build-iso-di.sh now drops dists/bookworm/ entirely and regenerates the
# udeb index at dists/resolute/main/debian-installer/binary-arm64/Packages
# via dpkg-scanpackages on the actual pool contents (which includes
# bookworm udebs we kept + trixie udebs we grafted in).
# anna and cdebootstrap/debootstrap both read from dists/resolute/.
d-i mirror/udeb/suite string resolute
d-i mirror/udeb/suite seen true
d-i mirror/udeb/components multiselect main
d-i mirror/udeb/components seen true

# CRITICAL (codex r26 review): d-i base-installer in CD mode honors
# cdrom/suite + cdrom/codename, NOT mirror/codename, when picking which
# dists/<suite>/ to bootstrap from. Without these, cdebootstrap targets
# bookworm (the bookworm dists/ tree we kept for udebs) instead of
# resolute.
d-i cdrom/suite string resolute
d-i cdrom/suite seen true
d-i cdrom/codename string resolute
d-i cdrom/codename seen true

# Allow unsigned Release (we don't GPG-sign the embedded mirror yet).
d-i debian-installer/allow_unauthenticated boolean true
d-i debian-installer/allow_unauthenticated seen true

# r179: apt-setup must be FULLY OFFLINE / cdrom-only EVEN WHEN A NETWORK IS
# PRESENT. On real metal (.66) the LAN is up, and d-i's apt-setup then runs the
# network mirror + security/updates/backports scans REGARDLESS of use_mirror if
# those questions are merely empty-but-UNSEEN: apt-setup defaults to selecting
# the services and scans ports.ubuntu.com, which fails/hangs on an offline LAN →
# "[!!] Select and install software — Installation step failed" (never reaches
# finish). use_mirror=false makes 50mirror exit before choose-mirror; the KEY
# additions are marking services-select SEEN (empty = no security/updates/
# backports scan) and emptying security_host. The installed system still gets
# ports.ubuntu.com sources post-boot (late.sh writes them). Nothing here needs
# the network — the baked squashfs is the complete system.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/use_mirror seen true
# EMPTY + SEEN => no security, no updates, no backports services (stops the
# "Scanning the security updates / release updates / backports repository" scans)
d-i apt-setup/services-select multiselect
d-i apt-setup/services-select seen true
d-i apt-cdrom-setup/no-cd boolean false
d-i apt-cdrom-setup/no-cd seen true

##############################################################################
# Account setup — USERNAME is operator-PROMPTED at install time (r177: this is
# the one interactive identity prompt; the hostname is auto ncz-<mac6>, never
# prompted). username, fullname, and password are deliberately left UNSEEN so
# d-i asks. Automated/KVM runs may still preseed them via the kernel cmdline
# (passwd/username=... passwd/user-password=...), which does not change the
# default interactive behaviour.
##############################################################################
d-i passwd/root-login boolean false
d-i passwd/root-login seen true
d-i passwd/make-user boolean true
d-i passwd/make-user seen true
# username, fullname, password are PROMPTED (not preseeded)
d-i passwd/user-default-groups string audio cdrom video plugdev netdev sudo dialout
d-i user-setup/allow-password-weak boolean true
d-i user-setup/allow-password-weak seen true
d-i user-setup/encrypt-home boolean false
d-i user-setup/encrypt-home seen true

##############################################################################
# Clock + time
##############################################################################
d-i clock-setup/utc boolean true
d-i clock-setup/utc seen true
d-i time/zone string America/New_York
d-i time/zone seen true
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp seen true

##############################################################################
# Partitioning (r130) — operator SELECTS + CONFIRMS the target disk.
#   p1 ESP    4 GiB fat32  -> /boot/efi  (r133: bumped 1->4 GiB for kernel-dev
#                           headroom — several vmlinuz+initrd sets + .bak copies
#                           live on the ESP and 1 GiB was getting tight)
#   p2 rescue 4 GiB ext4   (NCZRESCUE, no mountpoint; populated post-install
#                           by 72-rescue-partition.sh with the edge-kernel
#                           rescue env + full recovery toolset)
#   p3 root   rest  btrfs  -> /            (canonical fs preserved from r116)
#
# r130 SAFETY CHANGE: prior releases hard-coded /dev/nvme0n1 and unconditionally
# wiped it (wipefs + sgdisk --zap-all + dd) with NO prompt. A tester (MrSBC/COS)
# flagged this as dangerous, and the MS-R1 itself has more than one NVMe slot,
# so a fixed target is unsafe. We now:
#   - enumerate disks (NON-destructive) in early_command for operator visibility
#   - leave partman-auto/disk UNSET so d-i shows "Select disk to partition"
#   - the operator's disk SELECTION is the consent to wipe that disk; once
#     chosen, partman applies the recipe and writes automatically (r130.1:
#     simplified — see the confirm block below)
##############################################################################
# r173: interactive TARGET-DISK + ROOT-FILESYSTEM chooser. Replaces the old
# hardcoded /dev/nvme0n1 dd-zap (dangerous — wiped a FIXED device with no
# prompt) and the "first disk auto-picked at priority=critical" behaviour. The
# chooser (disk-fs-chooser.sh) enumerates disks, prompts the operator (via a
# CRITICAL-priority cdebconf select, shown even under priority=critical),
# wipes only the CHOSEN disk, and db_set's partman-auto/disk + a dynamically
# built expert_recipe with the CHOSEN fs (btrfs|ext4). It honours cmdline
# overrides ncz_disk=<dev> / ncz_fs=<ext4|btrfs> for unattended/KVM runs. The
# static partman-auto/expert_recipe below remains only as a safety fallback —
# the chooser's db_set (run here, before partman-auto reads the recipe) wins.
d-i partman/early_command string \
    _found=0 ; \
    if ! [ -f /cdrom/cixmini/disk-fs-chooser.sh ] && ! [ -f /hd-media/cixmini/disk-fs-chooser.sh ] && ! [ -f /media/cdrom/cixmini/disk-fs-chooser.sh ] && ! [ -f /run/live/medium/cixmini/disk-fs-chooser.sh ] ; then \
        for D in /cdrom/cixmini /hd-media/cixmini /media/cdrom/cixmini /run/live/medium/cixmini ; do \
            [ -f "$D/disk-fs-chooser.sh" ] && _found=1 && break ; \
        done ; \
        if [ "$_found" != 1 ] ; then \
            for _src_dev in /dev/sr0 /dev/sda1 /dev/sda /dev/vda1 /dev/vda ; do \
                [ -b "$_src_dev" ] || continue ; \
                mkdir -p /cdrom 2>/dev/null || true ; \
                mount -t iso9660 "$_src_dev" /cdrom 2>/dev/null && \
                    [ -f /cdrom/cixmini/disk-fs-chooser.sh ] && _found=1 && break ; \
                mount -o ro "$_src_dev" /cdrom 2>/dev/null && \
                    [ -f /cdrom/cixmini/disk-fs-chooser.sh ] && _found=1 && break ; \
                umount /cdrom 2>/dev/null || true ; \
            done ; \
        fi ; \
        if [ "$_found" != 1 ] ; then \
            for _src_dev in $(awk '$3~/^(iso9660|vfat|ext[234])$/{print $2}' /proc/mounts 2>/dev/null) ; do \
                mkdir -p /cdrom 2>/dev/null || true ; \
                umount /cdrom 2>/dev/null || true ; \
                mount --bind "$_src_dev" /cdrom 2>/dev/null && \
                    [ -f /cdrom/cixmini/disk-fs-chooser.sh ] && _found=1 && break ; \
                umount /cdrom 2>/dev/null || true ; \
            done ; \
        fi ; \
    fi ; \
    for D in /cdrom/cixmini /hd-media/cixmini /media/cdrom/cixmini /run/live/medium/cixmini ; do \
        if [ -f "$D/disk-fs-chooser.sh" ] ; then _found=1 ; sh "$D/disk-fs-chooser.sh" || exit $? ; break ; fi ; \
    done ; \
    if [ "$_found" != 1 ] ; then for V in /dev/console /dev/tty1 /dev/tty3; do echo "[ncz] FATAL: disk-fs-chooser.sh not found on install media -- refusing to let partman auto-pick a disk" > "$V" 2>/dev/null || true ; done ; exit 1 ; fi
d-i partman/early_command seen true

##############################################################################
# r40: partman/late_command — runs AFTER partman partitions+formats+mounts /target,
# BEFORE bootstrap-base. Extracts pre-built rootfs.tar.zst into /target so the
# stubbed bookworm /usr/sbin/debootstrap detects /target/etc/os-release and exits 0.
##############################################################################
d-i partman/late_command string sh /cdrom/cixmini/extract-rootfs.sh
d-i partman/late_command seen true

# r130: deliberately NO partman-auto/disk preseed — leaving it unset is what
# makes d-i present the disk-selection menu so the operator picks the target.
d-i partman-auto/method string regular
d-i partman-auto/method seen true
# r130: btrfs root preserved from r116, now with a dedicated rescue partition.
# Layout (3 primary partitions on the OPERATOR-CHOSEN disk):
#   p1: 4 GB  fat32 ESP    (method{ efi })                     -> /boot/efi  (r133: 1->4 GiB, kernel-dev headroom)
#   p2: 4 GB  ext4  rescue (label NCZRESCUE, NO mountpoint)    -> 72-rescue-partition.sh
#   p3: rest  btrfs root   (method{ format })                  -> /
# No swap (cixmini is a 64 GB-RAM edge box). btrfs feasibility verified r116:
#   - kernel CONFIG_BTRFS_FS=m; btrfs.ko + deps (crc32c/xor/raid6/zstd) ship
#     in the 7.0.12-cix-sky1-next module set (installer initrd + installed).
#   - partman-btrfs_59 + btrfs-progs-udeb_6.2 are in the ISO pool/udeb index.
# The rescue partition is ext4 (the rescue rootfs builder emits an ext4 image);
# btrfs-progs ships in the rescue toolset so the rescue env can mount the main
# btrfs root.
d-i partman-auto/expert_recipe string                         \
      cixmini ::                                              \
              2048 2048 2048 fat32                            \
                      $primary{ } $bootable{ }                \
                      method{ efi } format{ }                 \
              .                                               \
              4096 4096 4096 ext4                             \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      label{ NCZRESCUE }                      \
              .                                               \
              4096 8192 -1 btrfs                              \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ btrfs }   \
                      mountpoint{ / }                         \
              .
d-i partman-auto/expert_recipe seen true
d-i partman-auto/choose_recipe select cixmini
d-i partman-auto/choose_recipe seen true
# btrfs single-volume root carries no swap partition; suppress the d-i
# "no swap" warning so the unattended run doesn't stall.
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-basicfilesystems/no_swap seen true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/device_remove_lvm seen true
d-i partman-md/device_remove_md boolean true
d-i partman-md/device_remove_md seen true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm seen true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/confirm_nooverwrite seen true
# r130.1 SIMPLIFIED FLOW (operator feedback: the prior half-seen confirm flow
# broke the disk chooser — d-i applied the recipe but then stalled on the
# unacknowledged "write changes?" prompts). Now the operator's ONLY interaction
# is picking the target disk (partman-auto/disk left unset above). Once a disk
# is chosen, partman applies the recipe (ESP + rescue + btrfs root) and writes
# WITHOUT further prompts — the disk selection itself is the consent to wipe it.
# Every confirm question is marked `seen` so nothing stalls the flow.
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm_write_new_label seen true
d-i partman/choose_partition select finish
d-i partman/choose_partition seen true
d-i partman/unmount_active boolean true
d-i partman/unmount_active seen true
d-i partman/confirm boolean true
d-i partman/confirm seen true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm_nooverwrite seen true
# r130.1 CRITICAL FIX (Codex review): the 4GB ext4 RESCUE partition has NO
# mountpoint by design (72-rescue-partition.sh populates it post-install). d-i
# raises partman-basicfilesystems/no_mount_point ("No mount point is assigned
# for the ext4 filesystem ... return to the partitioning menu?") for exactly
# this case. Unseeded, it STALLS the unattended flow at finish — this was the
# broken disk chooser. Answer "return to menu? = NO" (false) so partman
# continues and leaves the rescue partition unmounted (its intended state).
d-i partman-basicfilesystems/no_mount_point boolean false
d-i partman-basicfilesystems/no_mount_point seen true
# Insurance: the parallel partman-partitioning namespace also owns a
# write-new-label confirm on some paths. Seed it so nothing stalls.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-partitioning/confirm_write_new_label seen true

##############################################################################
# Base system — debootstrap resolute with the gutsy script
#
# Bookworm's debootstrap (1.0.128) doesn't have a "resolute" script.
# Ubuntu debootstrap 1.0.141ubuntu1+ adds resolute as an upstream symlink,
# and Ubuntu codenames since gutsy (2007) use that same script family.
# So we tell base-installer to use the gutsy script for our resolute suite.
# Codex r26 review caught this — without the override, debootstrap fails
# with "No such script: resolute".
##############################################################################
d-i base-installer/debootstrap_script string gutsy
d-i base-installer/debootstrap_script seen true

# Skip the d-i kernel image install — we provide our own via late_command.
d-i base-installer/kernel/image string none
d-i base-installer/kernel/image seen true

# kernel/image=none is NOT sufficient on bookworm base-installer: when apt
# finds zero kernels in the (offline) sources it still raises the
# "no installable kernel found" prompt and blocks the install. take79
# suppressed it with these three; they were lost in the 26.6 preseed and
# the 26.6 build halted base-installer here. Our 3 kernels (6.18 LTS daily,
# 6.18 LTS rescue/safe, NEXT beta) are installed by post-install/10-our-kernel.sh.
d-i base-installer/kernel/skip-install boolean true
d-i base-installer/kernel/skip-install seen true
d-i base-installer/kernel/no-kernels-found boolean true
d-i base-installer/kernel/no-kernels-found seen true
d-i base-installer/kernel/failed-install boolean true
d-i base-installer/kernel/failed-install seen true

##############################################################################
# APT setup — offline mode. Mirror config above defines source = cdrom.
# After install, late.sh writes /etc/apt/sources.list pointing at
# ports.ubuntu.com so the new system can reach updates over network.
##############################################################################
# r179: EMPTY security_host + seen so apt-setup never scans a network security
# repo during install (belt-and-suspenders with services-select empty+seen).
# The installed system's ports.ubuntu.com sources are written by late.sh.
d-i apt-setup/security_host string
d-i apt-setup/security_host seen true
d-i apt-setup/security_path string
d-i apt-setup/security_path seen true

# Add Ubuntu universe + multiverse + restricted repos for the post-install
# /etc/apt/sources.list (apt-setup writes this even though install uses cdrom)
d-i apt-setup/restricted boolean true
d-i apt-setup/restricted seen true
d-i apt-setup/multiverse boolean true
d-i apt-setup/multiverse seen true
d-i apt-setup/universe boolean true
d-i apt-setup/universe seen true
# 2026-05-08 take24: STRIP Debian-style apt components — Ubuntu (resolute)
# uses main+universe+restricted+multiverse only. The previous
# `non-free` + `non-free-firmware` directives (Debian-style) caused
# apt-setup to write them into /target/etc/apt/sources.list, which
# generated repeated apt warnings ("doesn't have the component
# 'contrib'/'non-free'/...") and contributed to pkgsel-time noise.
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/non-free-firmware seen true
d-i apt-setup/non-free boolean false
d-i apt-setup/non-free seen true
d-i apt-setup/contrib boolean false
d-i apt-setup/contrib seen true

##############################################################################
# Tasksel — skip Debian-specific tasks (would fail on Ubuntu suite anyway)
##############################################################################
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/run_tasksel seen true
tasksel tasksel/first multiselect

# r178: pkgsel/include is EMPTY — "Select and install software" is a NO-OP.
#
# The layered base+desktop squashfs installed by the STUB IS the complete system
# (network-manager, xfce, falkon, openssh-server, ca-certificates, curl, gnupg,
# lsb-release, sudo, zstd, etc. are ALL already baked — verified via dpkg status
# in the squashfs). Running pkgsel's apt-get install of an include list is
# therefore redundant AND it created a hard dependency on a reachable/complete
# APT mirror: on a real OFFLINE install (no reachable mirror) that step exits
# non-zero → "[!!] Select and install software — Installation step failed" and
# the install never reaches finish/reboot (observed on native-arm64 .66, r177).
# Empty include + run_tasksel=false (below) makes pkgsel a genuine no-op so the
# baked-rootfs install completes fully offline.
#
# EXCEPTION — telnetd (doctrine #9 fleet lockout-prevention): inetutils-telnetd +
# openbsd-inetd are the only formerly-included packages NOT yet baked into the
# squashfs. They are added to manifests/desktop.pkgs for the next squashfs bake;
# until that lands, late.sh installs them from the OFFLINE /cdrom pool (NOT a
# network mirror), so every installed host still has telnet.
d-i pkgsel/include string
d-i pkgsel/include seen true
# 2026-05-08 take24: pkgsel's default set pulls Debian-only packages
# that don't exist on Ubuntu resolute. Without explicit exclude,
# `apt-get install discover installation-report popularity-contest`
# returns "Unable to locate package" → pkgsel exits 100 → install fails.
# These are all Debian-specific (Ubuntu uses udev for discover, has
# no installation-report mailer, uses ubuntu-popcon if any popcon).
d-i pkgsel/exclude string discover installation-report popularity-contest
d-i pkgsel/exclude seen true
popularity-contest popularity-contest/participate boolean false
popularity-contest popularity-contest/participate seen true
d-i pkgsel/upgrade select none
d-i pkgsel/upgrade seen true
d-i pkgsel/update-policy select none
d-i pkgsel/update-policy seen true
d-i pkgsel/updatedb boolean false
d-i pkgsel/updatedb seen true

# 2026-05-07 take9 (per pkgsel-cascade-failure on .66 take8 install):
# don't pull Recommends. The 30-deep python3-launchpadlib dep chain that
# Ubuntu's openssh-server Recommends (via ssh-import-id) is what got us
# into "Temporary failure resolving" cascade-fail when one transient DNS
# blip aborted the whole batch. With Recommends off, we install just the
# 6 explicit packages and their hard Depends — much smaller download
# set, much smaller blast radius.
d-i pkgsel/install-recommends boolean false
d-i pkgsel/install-recommends seen true
# 2026-05-08 (Codex r78 take13 audit MEDIUM #1): the documented Debian
# d-i question is pkgsel/include/install-recommends — pkgsel/install-recommends
# is the historical Ubuntu name and likely silently ignored by trixie d-i.
# Preseed both so we cover bookworm + trixie + Ubuntu d-i variants.
d-i pkgsel/include/install-recommends boolean false
d-i pkgsel/include/install-recommends seen true

# 2026-05-07 take10: same logic for base-installer. Take9's pkgsel fix
# only covered pkgsel; base-installer was still pulling its own Recommends
# (libpng16, libfuse3, gettext-base, etc.) and hitting the same DNS
# cascade-fail.
d-i base-installer/install-recommends boolean false
d-i base-installer/install-recommends seen true

##############################################################################
# Bootloader — d-i installs GRUB to ESP. Our 70-bootloader.sh in late.sh
# replaces it with systemd-boot + our Sky1 kernel + working cmdline.
##############################################################################
# r45: skip grub-installer entirely. We use systemd-boot via post-install
# hook 70-bootloader.sh, so the target system does not need GRUB. d-i's
# grub-installer also tries to call grub-install with --force-extra-removable
# which the cloudimg rootfs grub does not support — skipping avoids both
# issues. preseed/late_command (our late.sh) runs anyway and our hook chain
# writes the proper systemd-boot loader entries.
d-i grub-installer/skip boolean true
d-i grub-installer/skip seen true
# Debian forky's d-i also ships systemd-boot-installer, which resolute/bookworm
# did not, so skipping grub-installer alone no longer skips the bootloader step:
# main-menu runs systemd-boot-installer instead, bootctl fails under the
# installer's efi=noruntime cmdline, and the install stops on a critical
# "Installation step failed: Install the systemd-boot boot loader" dialog after
# the base system is already on disk. We install the bootloader ourselves from
# post-install/70-bootloader.sh (rEFInd), so skip this step the same way.
d-i systemd-boot-installer/skip boolean true
d-i systemd-boot-installer/skip seen true
d-i nobootloader/confirmation_common boolean true
d-i nobootloader/confirmation_common seen true

# Legacy lines kept commented for reference if we ever flip back to GRUB:
# d-i grub-installer/only_debian boolean true
# d-i grub-installer/with_other_os boolean true
# d-i grub-installer/bootdev string default

##############################################################################
# Late command — invoke our cixmini bootstrapper.
##############################################################################
d-i preseed/late_command string \
    sh /cdrom/cixmini/late.sh
d-i preseed/late_command seen true

##############################################################################
# Finish
d-i finish-install/keep-consoles boolean true
d-i finish-install/keep-consoles seen true
# r160: suppress the final "Installation complete — <Continue> to reboot"
# dialog. Without this note preseeded, an unattended install sits at the
# Finish screen forever (observed r159 in the qemu harness).
d-i finish-install/reboot_in_progress note
##############################################################################
d-i debian-installer/exit/poweroff boolean false
d-i debian-installer/exit/poweroff seen true
d-i debian-installer/exit/reboot boolean true
d-i debian-installer/exit/reboot seen true

# r157 (codex/Debian-sourced): baked rootfs already ships a kernel. d-i must NOT
# install another, else needrestart raises a CRITICAL kernel-reboot note that
# stalls the install before late_command/70-bootloader (no bootloader installed).
d-i base-installer/kernel/image select none
d-i base-installer/kernel/image seen true
d-i base-installer/kernel/skip-install boolean true
d-i base-installer/kernel/skip-install seen true
