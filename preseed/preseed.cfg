# preseed.cfg — nclawzero unattended install via bookworm d-i (NCZ-OS 26.7 / Debian forky target)
#
# HISTORICAL FILE: written in the Ubuntu-resolute era (r17-r49); the live
# pipeline build-iso-di.sh (~line 2335) still copies this file in as a
# TEMPLATE and rewrites suite/codename/mirror/hotname to match release.conf
# (NCZ_BASE_MIRROR + NCZ_BASE_CODENAME) on every build, so the produced ISO
# targets NCZ_BASE_CODENAME (Debian forky on 26.7) regardless of what the
# raw mirror lines below say. Do NOT edit mirror lines by hand — edit
# release.conf or the sed pass in build-iso-di.sh.
#
# d-i provides the installer (busybox initrd, debootstrap, apt-setup); the
# installed system is retargeted at build time via the sed pass above.

##############################################################################
# Localization — native d-i prompts
#
# Leave debian-installer/locale and keyboard-configuration/* unanswered here.
# localechooser and keyboard-configuration intentionally raise their own
# questions to critical priority, so real installs get Debian's upstream
# language/country/locale and layout/variant dialogs even under priority=critical.
# The unattended KVM gate patches a throwaway qemutest ISO with gate-only
# preseed answers; do not add fallback values here or mark these questions seen.
##############################################################################

##############################################################################
# Network — DHCP, fully automatic, retry forever.
##############################################################################
d-i netcfg/choose_interface select auto
d-i netcfg/choose_interface seen true
# r177: hostname is a PLACEHOLDER only (seen -> d-i NEVER prompts for it). The
# installed system's real hostname is auto-derived per-machine as ncz-<mac6>
# (last 6 hex of the primary ethernet MAC) by the ncz-firstboot oneshot on first
# boot, where the real hardware MAC is authoritative. The operator-facing
# interactive prompt is the USERNAME (see passwd/* below), NOT the hostname.
d-i netcfg/get_hostname string ncz-setup
d-i netcfg/get_hostname seen true
d-i netcfg/hostname string ncz-setup
d-i netcfg/hostname seen true
d-i netcfg/get_domain string nclawzero.lan
d-i netcfg/get_domain seen true
d-i netcfg/wireless_wep string
# 2026-05-07 take10: fallback nameservers. DHCP-provided DNS overrides this
# when present, but if the LAN router's DNS is flaky/overloaded mid-install
# (observed when a single upstream resolver dropped queries during pkgsel +
# grub-package fetch), apt falls through to these public resolvers. Network-
# neutral: no site-specific gateway baked in.
d-i netcfg/get_nameservers string 8.8.8.8 1.1.1.1
d-i netcfg/get_nameservers seen true

d-i netcfg/disable_autoconfig boolean false
d-i netcfg/disable_autoconfig seen true
d-i netcfg/link_wait_timeout string 60
d-i netcfg/link_wait_timeout seen true
d-i netcfg/link_detection_timeout string 60
d-i netcfg/link_detection_timeout seen true
d-i netcfg/dhcp_timeout string 120
d-i netcfg/dhcp_timeout seen true
d-i netcfg/dhcpv6_timeout string 120
d-i netcfg/dhcpv6_timeout seen true
d-i netcfg/dhcp_failed note
# r178: an install must not stall if DHCP assigns an address but sets NO
# default route (isolated LAN / no gateway). Without this, netcfg raises
# "[!!] Configure the network — Continue without a default route?" and blocks
# the unattended flow. Auto-continue (Yes). NOTE (2026-09-24): this used to
# say "the install needs no Internet — everything is on the media", which is
# no longer true -- d-i's own udebs are fetched by anna from the live archive
# (see the Mirror block). The target rootfs really is on the media; d-i's
# components are not. Continuing past a missing default route is still the
# right answer here, it just is not a guarantee the install can finish
# without reachable networking.
d-i netcfg/no_default_route boolean true
d-i netcfg/no_default_route seen true
# r79: do NOT auto-retry forever on no-link. Previously dhcp_options was
# preseeded + marked seen, so a missing Ethernet carrier looped silently
# with no actionable message (worst on Orion O6, whose real issue was the
# now-shipped rtl_nic firmware). Leaving dhcp_options unset makes d-i stop
# on its standard "Network autoconfiguration failed" note so the operator
# can plug in a wired cable and Retry once — wired link is required.

##############################################################################
# anna: skip the "No kernel modules were found" critical prompt.
##############################################################################
d-i anna/no_kernel_modules boolean true
d-i anna/no_kernel_modules seen true

##############################################################################
# Network-console — SSH for live remote diagnostics during install
#
# Three layers of in-install diagnostic access:
#
#  1. installer@<host> via password "diags" — d-i curses menu.
#     Default for unattended ops; works on any client without keys.
#  2. root@<host> via fleet pubkey — direct shell, no curses menu.
#     For scripted recovery when the install bombs at a stage that
#     blocks the curses menu (e.g. anna stalls before menu spawn).
#     Wired up by the early_command below.
#  3. magnetar@<host> via fleet pubkey or password "diags" —
#     persistent post-install diag user. See post-install/09-diag-account.sh
#     (TESTING ONLY — remove before public ship).
#
# All three exist for one reason: a remote operator must always have at
# least one working credential against this box, regardless of what stage
# of install bombed.
##############################################################################
# network-console is NO LONGER forced here. Loading it makes d-i run its whole
# UI over SSH: the local screen gets the branded background and nothing else,
# which reads as "the installer has no video" to anyone sitting at the machine.
# Measured on O6N 2026-08-13 with r229 -- console=tty0 only, no serial in
# /proc/cmdline, display stack provably fine (writes to /dev/tty1 and
# /dev/console both appeared on the monitor) -- and the screen still showed
# only the NCZ INSTALLER branding because the menu was being served to
# ssh installer@<host>.
#
# The DIAG boot entry passes these on the kernel cmdline instead, so a headless
# or remote install still gets the network console on demand. The credentials
# below stay preseeded so that path needs no interaction when it IS requested.
#
# Root SSH no longer depends on loading network-console: diag-console.sh
# installs openssh-server-udeb directly, writes a minimal diag-owned sshd_config,
# and starts root-capable sshd without handing the local d-i UI to
# network-console. The DIAG boot entry may still request network-console for its
# own serial/headless workflow; the normal install path keeps local video.
d-i network-console/password password diags
d-i network-console/password seen true
d-i network-console/password-again password diags
d-i network-console/password-again seen true
d-i network-console/start select Continue
d-i network-console/start seen true

##############################################################################
# preseed/early_command — runs ASAP after preseed loads.
#
# Seed fleet authorized_keys for root in the d-i ramdisk so a remote
# operator can SSH `root@<host>` directly during install (bypassing the
# network-console curses menu wrapper that scripts can't drive).
#
# 2026-05-07 (Codex r78 audit): early_command runs IMMEDIATELY after
# preseed loads, BEFORE network-console installs the openssh-server udeb.
# So patching /etc/ssh/sshd_config inline here is a no-op — sshd_config
# doesn't exist yet. Workaround: write authorized_keys + sentinel now,
# then spawn a background watcher that polls for sshd_config + a running
# sshd, and patches PermitRootLogin yes only once sshd is actually up.
#
# d-i busybox initrd does NOT ship `nohup`. Bare `&` is sufficient: the
# orphaned watcher gets reparented to init and survives early_command's
# exit. Redirecting stdin/stdout/stderr to /dev/null on the line below
# detaches the watcher cleanly.
#
# 2026-08-24: every backgrounded helper ALSO closes fds 3-6 (3>&- 4>&- 5>&-
# 6>&-). In this postinst context fd3 is the WRITE end of cdebconf's command
# pipe and fds 4-6 are dups of main-menu's original stdio. A long-lived
# orphan (watcher, diag sshd and every ssh session it spawns) holding fd3
# open means cdebconf NEVER sees EOF on its command pipe after main-menu
# exits, so any installer crash turns into a silent eternal wedge on a blank
# screen instead of d-i's loud "installer step failed" recovery path —
# measured live on .66 during the 2026-08-24 "Cannot find \"ok\" in menu"
# forensics, where the debconf frontend sat in anon_pipe_read held open only
# by the diag sshd chain. Closing the fds also makes it impossible for any
# future backgrounded helper to inject confmodule commands whose replies
# nobody reads (the root cause of that same wedge, see
# component-selector.sh).
#
# Both fleet keys go in: jperlow@work-laptop + argos-backup. Same key
# set 35-ssh.sh and 09-diag-account.sh use post-install — symmetry on
# purpose, so the same SSH client config Just Works at every stage.
#
# r196c: netcfg/choose_interface=auto is NOT carrier-aware — on boards with
# multiple NICs where one port has no cable routed to it (Orion O6N:
# enp1s0 dead, enp49s0 live), auto can still land on the dead port and
# DHCPDISCOVER then spins forever with zero wire traffic (no link_wait_
# timeout note is ever raised because the interface exists, it just has no
# carrier). Fixed at the end of this same early_command: administratively
# raise every NIC first, then poll /sys/class/net/*/carrier in parallel for
# up to 25s (RTL8125B autoneg takes ~9-13s) and db_set
# netcfg/choose_interface to whichever NIC actually has carrier=1 before
# netcfg runs. Raising the NICs is required: Linux does not report carrier
# for an interface that is still administratively down. Falls back to auto
# if nothing gets carrier in time.
##############################################################################
d-i preseed/early_command string \
    set +e ; \
    NCZREV=$(for t in $(cat /proc/cmdline); do case $t in ncz_rev=*) echo ${t#ncz_rev=};; esac; done) ; \
    ( i=0 ; while [ $i -lt 60 ] ; do for V in /dev/tty1 /dev/tty2 /dev/tty3 /dev/tty4 /dev/ttyS0; do echo "==== NCZ-OS INSTALLER ${NCZREV:-?} ====" > $V 2>/dev/null || true; done ; sleep 2 ; i=$((i+1)) ; done ) </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- & \
    BB_UNAME_M=$(/ncz/busybox uname -m 2>/dev/null) ; case "$BB_UNAME_M" in aarch64) NCZ_BB_ARCH=arm64 ;; x86_64) NCZ_BB_ARCH=amd64 ;; *) NCZ_BB_ARCH=arm64 ;; esac ; \
    NCZSRC="" ; while read _d _mp _r ; do [ -f "$_mp/ncz-payload/base.squashfs" ] && NCZSRC="$_mp/ncz-payload" && break ; done < /proc/mounts ; \
    if [ -z "$NCZSRC" ] ; then for _c in /cdrom/ncz-payload /hd-media/ncz-payload /media/cdrom/ncz-payload /run/live/medium/ncz-payload ; do [ -d "$_c" ] && NCZSRC="$_c" && break ; done ; fi ; \
    [ -n "$NCZSRC" ] || NCZSRC=/cdrom/ncz-payload ; \
    _ncz_helper() { \
        for _c in "/ncz/$1" "$NCZSRC/$1" ; do \
            [ -f "$_c" ] && { echo "$_c" ; return 0 ; } ; \
        done ; \
        echo "early_command: MISSING helper $1 (not baked at /ncz, not at $NCZSRC)" >> /var/log/early_command.log ; \
        for V in /dev/tty1 /dev/tty3 ; do echo "[ncz] WARNING: installer helper $1 is MISSING -- continuing without it" > $V 2>/dev/null || true ; done ; \
        return 1 ; \
    } ; \
    mkdir -p /root/.ssh && chmod 0700 /root/.ssh ; \
    { \
        echo '# nclawzero fleet diag keys (auto-injected by preseed early_command)' ; \
        echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBJ3z+8UX2oPt3cmN1X9XU8RWrgp7VvdHPd0vW+m/AoR jperlow@work-laptop' ; \
        echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHKCDT5Busd1J+j4kpzkZ/jT/GtUQylaZCUCTftY2sYk argos-backup' ; \
    } > /root/.ssh/authorized_keys ; \
    chmod 0600 /root/.ssh/authorized_keys ; \
    date -u +"early_command-fired %FT%TZ" > /etc/early_command_ran.txt ; \
    ls -la /root/.ssh /etc/early_command_ran.txt > /var/log/early_command.log 2>&1 ; \
    if _p=$(_ncz_helper sshd-watcher.sh) ; then cp "$_p" /tmp/sshd-watcher.sh ; chmod +x /tmp/sshd-watcher.sh ; /tmp/sshd-watcher.sh </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- & fi ; \
    ( \
        set +e ; \
        for _u in libc6-udeb zlib1g-udeb libcrypt1-udeb libcrypto3-udeb openssh-client-udeb openssh-server-udeb ; do \
            _f=$(ls /ncz/ssh-udebs/${_u}_*.udeb 2>/dev/null | head -1) ; \
            if [ -n "$_f" ] ; then \
                udpkg -i "$_f" >>/var/log/early_command.log 2>&1 && \
                    echo "early_command: installed $_u from $_f" >> /var/log/early_command.log || \
                    echo "early_command: WARNING udpkg -i failed for $_f (may already be present)" >> /var/log/early_command.log ; \
            else \
                echo "early_command: $_u not baked at /ncz/ssh-udebs -- remote SSH diagnostics unavailable" >> /var/log/early_command.log ; \
            fi ; \
        done ; \
        if [ -x /usr/sbin/sshd ] ; then \
            mkdir -p /run/sshd 2>/dev/null ; \
            [ -f /etc/ssh/ssh_host_ed25519_key ] || ssh-keygen -A >>/var/log/early_command.log 2>&1 ; \
            if ! pidof sshd >/dev/null 2>&1 ; then \
                /usr/sbin/sshd >>/var/log/early_command.log 2>&1 && \
                    echo "early_command: started sshd $(date -u +%FT%TZ)" >> /var/log/early_command.log || \
                    echo "early_command: WARNING sshd failed to start" >> /var/log/early_command.log ; \
            fi ; \
        else \
            echo "early_command: /usr/sbin/sshd not present after udpkg -i attempts" >> /var/log/early_command.log ; \
        fi ; \
    ) </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- & \
    mkdir -p /tmp/nczdiag ; \
    for _bb in /ncz/busybox "$NCZSRC/busybox-$NCZ_BB_ARCH" ; do \
        [ -f "$_bb" ] && cp "$_bb" /tmp/nczdiag/busybox && chmod +x /tmp/nczdiag/busybox && break ; \
    done ; \
    if [ ! -x /tmp/nczdiag/busybox ] ; then \
        echo "early_command: MISSING diag busybox for $NCZ_BB_ARCH (not baked at /ncz/busybox, not at $NCZSRC)" >> /var/log/early_command.log ; \
        for V in /dev/tty1 /dev/tty3 ; do echo "[ncz] WARNING: diag busybox for $NCZ_BB_ARCH is MISSING" > $V 2>/dev/null || true ; done ; \
    fi ; \
    if _p=$(_ncz_helper diag-console.sh) ; then cp "$_p" /tmp/diag-console.sh ; chmod +x /tmp/diag-console.sh ; /tmp/diag-console.sh </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- & fi ; \
    for V in /dev/tty1 /dev/tty3; do echo "[ncz] Detecting storage/USB devices, please wait..." > $V 2>/dev/null || true; done ; \
    if _p=$(_ncz_helper usb-rescan.sh) ; then cp "$_p" /tmp/usb-rescan.sh ; chmod +x /tmp/usb-rescan.sh ; /tmp/usb-rescan.sh </dev/null >/dev/null 2>&1 3>&- 4>&- 5>&- 6>&- ; fi ; \
    if [ ! -e /usr/share/debootstrap/scripts/forky ]; then \
        ln -sf gutsy /usr/share/debootstrap/scripts/forky 2>>/var/log/early_command.log ; \
        echo "early_command: linked forky -> gutsy" >> /var/log/early_command.log ; \
    fi ; \
    { . /usr/share/debconf/confmodule 2>/dev/null || . /usr/lib/cdebconf/confmodule 2>/dev/null || true ; } ; \
    NCZ_IS_MAC=0 ; \
    _dmi="$(cat /sys/class/dmi/id/sys_vendor 2>/dev/null) $(cat /sys/class/dmi/id/board_vendor 2>/dev/null) $(cat /sys/class/dmi/id/product_name 2>/dev/null)" ; \
    case "$_dmi" in *Apple*|*apple*|*APPLE*) NCZ_IS_MAC=1 ;; esac ; \
    if [ "$NCZ_IS_MAC" != 1 ] ; then \
        for _d in /sys/bus/pci/devices/* ; do \
            [ -r "$_d/vendor" ] || continue ; \
            [ "$(cat "$_d/vendor" 2>/dev/null)" = "0x106b" ] && NCZ_IS_MAC=1 && break ; \
        done ; \
    fi ; \
    echo "early_command: DMI=[$_dmi] NCZ_IS_MAC=$NCZ_IS_MAC" >> /var/log/early_command.log ; \
    _nicudebs="nic-usb-modules nic-modules nic-shared-modules nic-wireless-modules nic-pcmcia-modules" ; \
    if [ "$NCZ_IS_MAC" = 1 ] ; then \
        _nicudebs="nic-usb-modules nic-modules nic-shared-modules nic-pcmcia-modules" ; \
        mkdir -p /etc/modprobe.d ; \
        for _wm in brcmfmac brcmfmac_wcc brcmutil iwlwifi iwlmvm ath10k_pci ath11k_pci mac80211 cfg80211 ; do \
            echo "blacklist $_wm" >> /etc/modprobe.d/ncz-no-wifi-on-mac.conf ; \
        done ; \
        echo "early_command: Apple hardware -- skipping nic-wireless-modules and blacklisting wireless drivers" >> /var/log/early_command.log ; \
        for V in /dev/tty1 /dev/tty3 ; do echo "[ncz] Apple hardware detected: wireless install is DISABLED, connect a wired adapter" > $V 2>/dev/null || true ; done ; \
    fi ; \
    for V in /dev/tty1 /dev/tty3; do echo "[ncz] Loading NIC driver modules (USB/shared)..." > $V 2>/dev/null || true; done ; \
    for _nicudeb in $_nicudebs ; do \
        _u=$(find /cdrom /hd-media /media/cdrom /run/live/medium -iname "${_nicudeb}-*.udeb" 2>/dev/null | head -1) ; \
        if [ -n "$_u" ]; then \
            udpkg -i "$_u" >>/var/log/early_command.log 2>&1 && \
                echo "early_command: installed $_nicudeb from $_u" >> /var/log/early_command.log || \
                echo "early_command: WARNING udpkg -i failed for $_u" >> /var/log/early_command.log ; \
        else \
            echo "early_command: $_nicudeb udeb not found on medium, skipping" >> /var/log/early_command.log ; \
        fi ; \
    done ; \
    depmod -a >>/var/log/early_command.log 2>&1 || true ; \
    udevadm trigger --action=add --subsystem-match=usb 2>>/var/log/early_command.log || true ; \
    udevadm settle --timeout=5 2>>/var/log/early_command.log || true ; \
    if [ "$NCZ_IS_MAC" = 1 ] ; then \
        command -v rfkill >/dev/null 2>&1 && rfkill block all >>/var/log/early_command.log 2>&1 ; \
        for _if in /sys/class/net/* ; do \
            _ifn=${_if##*/} ; \
            { [ -d "$_if/wireless" ] || [ -e "$_if/phy80211" ] ; } || continue ; \
            _wdev=$(readlink -f "$_if/device" 2>/dev/null) ; \
            if [ -n "$_wdev" ] && [ -e "$_wdev/driver/unbind" ] ; then \
                echo "${_wdev##*/}" > "$_wdev/driver/unbind" 2>>/var/log/early_command.log && \
                    echo "early_command: unbound wireless $_ifn so netcfg never offers it" >> /var/log/early_command.log ; \
            else \
                echo "early_command: WARNING wireless $_ifn present but could not be unbound" >> /var/log/early_command.log ; \
            fi ; \
        done ; \
    fi ; \
    _ncz_if_rank() { \
        _k=/sys/class/net/$1 ; \
        { [ -d "$_k/wireless" ] || [ -e "$_k/phy80211" ] ; } && { echo 9 ; return ; } ; \
        case "$(cat "$_k/address" 2>/dev/null)" in ac:de:4?:00:11:22) echo 4 ; return ;; esac ; \
        _kd=$(readlink -f "$_k/device" 2>/dev/null) ; \
        case "$_kd" in *"/usb"*) echo 2 ; return ;; esac ; \
        case "$_kd" in /sys/devices/pci*) echo 1 ; return ;; esac ; \
        echo 3 ; \
    } ; \
    PICKED_IF="" ; PICKED_RANK=9 ; \
    for _i in $(seq 1 45); do \
        for _if in /sys/class/net/*; do \
            _ifn=${_if##*/} ; \
            [ "$_ifn" = "lo" ] && continue ; \
            ip link set dev "$_ifn" up 2>>/var/log/early_command.log || true ; \
        done ; \
        for _if in /sys/class/net/*; do \
            _ifn=${_if##*/} ; \
            [ "$_ifn" = "lo" ] && continue ; \
            [ -f "$_if/carrier" ] || continue ; \
            [ "$(cat "$_if/carrier" 2>/dev/null)" = "1" ] || continue ; \
            _r=$(_ncz_if_rank "$_ifn") ; \
            [ "$_r" -ge 9 ] && continue ; \
            if [ "$_r" -lt "$PICKED_RANK" ] ; then \
                PICKED_RANK=$_r ; PICKED_IF=$_ifn ; \
                echo "early_command: wired candidate $_ifn rank=$_r at ${_i}s" >> /var/log/early_command.log ; \
            fi ; \
        done ; \
        [ "$PICKED_RANK" -le 1 ] && break ; \
        [ -n "$PICKED_IF" ] && [ "$_i" -ge 25 ] && break ; \
        for V in /dev/tty1 /dev/tty3; do echo "[ncz] Waiting for a wired network link... (${_i}s/45s)" > $V 2>/dev/null || true; done ; \
        sleep 1 ; \
    done ; \
    if [ -n "$PICKED_IF" ] && command -v db_set >/dev/null 2>&1 ; then \
        echo "early_command: selected $PICKED_IF (rank $PICKED_RANK) after ${_i}s, forcing netcfg/choose_interface" >> /var/log/early_command.log ; \
        db_set netcfg/choose_interface "$PICKED_IF" ; \
        db_fset netcfg/choose_interface seen true ; \
    else \
        echo "early_command: no wired carrier after ${_i}s (PICKED_IF=$PICKED_IF, db_set=$(command -v db_set)), leaving netcfg/choose_interface=auto" >> /var/log/early_command.log ; \
        if [ "$NCZ_IS_MAC" = 1 ] ; then for V in /dev/tty1 /dev/tty3 ; do echo "[ncz] No wired link found. On Apple hardware this installer requires a wired adapter." > $V 2>/dev/null || true ; done ; fi ; \
    fi ; \
    if _p=$(_ncz_helper component-selector.sh) ; then cp "$_p" /tmp/component-selector.sh ; chmod +x /tmp/component-selector.sh ; sh /tmp/component-selector.sh >>/var/log/early_command.log 2>&1 ; fi ; \
    true
d-i preseed/early_command seen true

##############################################################################
# Mirror — the pinned snapshot.debian.org archive.
#
# ACCURACY NOTE (2026-09-24): this block used to describe a "ZERO network
# dependency" install against a curated resolute arm64 mirror embedded on the
# ISO. Neither half is true of this pipeline any more, and leaving the claim
# there made the network requirement look like a regression instead of the
# deliberate trade it is. What is actually true now:
#
#   * The TARGET OS ROOTFS still comes entirely from the medium: base.squashfs
#     (+ the desktop/hotfix overlays) extracted into /target by the r159 stub
#     that replaces /usr/sbin/debootstrap. No package downloads for the system
#     being installed.
#   * d-i ITSELF needs the network. The substrate is Debian's DAILY-rebuilt
#     netboot build (see build/iso/import-substrate.py), which carries no
#     pool/, so anna fetches d-i's own udebs from the live archive at install
#     time. That switch was made deliberately on 2026-09-24: per-suite
#     "current" netboot builds lag the live forky archive's glibc and die with
#     "GLIBC_x.xx not found" when anna pulls real udebs.
#
# So: wired network required for the installer's own components; the installed
# system's contents come off the medium either way.
#
# The values below are checked against release.conf at build time by
# build/check-preseed-mirror-sync.sh -- do not hand-edit them out of sync.
##############################################################################
# r180: fixed 2026-09-24 -- this block was hardcoded to ports.ubuntu.com
# (Ubuntu Ports, arm64-only) despite the project running Debian testing
# (forky) on BOTH arm64 and amd64 (release.conf: NCZ_BASE_NAME=Debian,
# NCZ_BASE_CODENAME=forky). Real, observed failure: on an amd64 install
# choose-mirror ran regardless of apt-setup/use_mirror=false (that only
# suppresses the LATER sources.list write, not this early Release-file
# check) and correctly got "Architecture not supported" from
# ports.ubuntu.com. Pointed at the same pinned snapshot.debian.org
# archive release.conf's NCZ_BASE_MIRROR_SNAPSHOT already uses for the
# squashfs build itself, so this check succeeds against a real, correct,
# matching Debian archive instead of failing against the wrong distro.
d-i mirror/protocol string http
d-i mirror/protocol seen true
d-i mirror/country string manual
d-i mirror/country seen true
d-i mirror/http/hostname string snapshot.debian.org
d-i mirror/http/hostname seen true
d-i mirror/http/directory string /archive/debian/20260920T203924Z
d-i mirror/http/directory seen true
d-i mirror/http/proxy string
d-i mirror/http/suite string forky
d-i mirror/http/suite seen true
d-i mirror/codename string forky
d-i mirror/codename seen true
d-i mirror/suite string forky
d-i mirror/suite seen true

# r31+ ARCHITECTURE: ONE suite (resolute) for both regular debs AND udebs.
# build-iso-di.sh now drops dists/bookworm/ entirely and regenerates the
# udeb index at dists/resolute/main/debian-installer/binary-arm64/Packages
