# r179: apt-setup must be cdrom-only EVEN WHEN A NETWORK IS PRESENT. (This
# is about apt-setup specifically, not about the install as a whole -- d-i's
# own component fetching does use the network, see the Mirror block above.) On real metal (.66) the LAN is up, and d-i's apt-setup then runs the
# network mirror + security/updates/backports scans REGARDLESS of use_mirror if
# those questions are merely empty-but-UNSEEN: apt-setup defaults to selecting
# the services and scans ports.ubuntu.com, which fails/hangs on an offline LAN →
# "[!!] Select and install software — Installation step failed" (never reaches
# finish). use_mirror=false makes 50mirror exit before choose-mirror; the KEY
# additions are marking services-select SEEN (empty = no security/updates/
# backports scan) and emptying security_host. The installed system still gets
# ports.ubuntu.com sources post-boot (late.sh writes them). Nothing here needs
# the network — the baked squashfs is the complete system.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/use_mirror seen true
# EMPTY + SEEN => no security, no updates, no backports services (stops the
# "Scanning the security updates / release updates / backports repository" scans)
d-i apt-setup/services-select multiselect
d-i apt-setup/services-select seen true
d-i apt-cdrom-setup/no-cd boolean false
d-i apt-cdrom-setup/no-cd seen true

