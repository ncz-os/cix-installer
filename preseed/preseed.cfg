# d-i asks. Automated/KVM runs may still preseed them via the kernel cmdline
# (passwd/username=... passwd/user-password=...), which does not change the
# default interactive behaviour.
##############################################################################
d-i passwd/root-login boolean false
d-i passwd/root-login seen true
d-i passwd/make-user boolean true
d-i passwd/make-user seen true
