##############################################################################
# Partitioning (r130) — operator SELECTS + CONFIRMS the target disk.
#   p1 ESP    4 GiB fat32  -> /boot/efi  (r133: bumped 1->4 GiB for kernel-dev
#                           headroom — several vmlinuz+initrd sets + .bak copies
#                           live on the ESP and 1 GiB was getting tight)
#   p2 rescue 4 GiB ext4   (NCZRESCUE, no mountpoint; populated post-install
#                           by 72-rescue-partition.sh with the edge-kernel
#                           rescue env + full recovery toolset)
#   p3 root   rest  btrfs  -> /            (canonical fs preserved from r116)
#
# r130 SAFETY CHANGE: prior releases hard-coded /dev/nvme0n1 and unconditionally
# wiped it (wipefs + sgdisk --zap-all + dd) with NO prompt. A tester (MrSBC/COS)
# flagged this as dangerous, and the MS-R1 itself has more than one NVMe slot,
# so a fixed target is unsafe. We now:
#   - enumerate disks (NON-destructive) in early_command for operator visibility
#   - leave partman-auto/disk UNSET so d-i shows "Select disk to partition"
#   - the operator's disk SELECTION is the consent to wipe that disk; once
#     chosen, partman applies the recipe and writes automatically (r130.1:
#     simplified — see the confirm block below)
##############################################################################
# r173: interactive TARGET-DISK + ROOT-FILESYSTEM chooser. Replaces the old
# hardcoded /dev/nvme0n1 dd-zap (dangerous — wiped a FIXED device with no
# prompt) and the "first disk auto-picked at priority=critical" behaviour. The
# chooser (disk-fs-chooser.sh) enumerates disks, prompts the operator (via a
# CRITICAL-priority cdebconf select, shown even under priority=critical),
# wipes only the CHOSEN disk, and db_set's partman-auto/disk + a dynamically
# built expert_recipe with the CHOSEN fs (btrfs|ext4). It honours cmdline
# overrides ncz_disk=<dev> / ncz_fs=<ext4|btrfs> for unattended/KVM runs. The
# static partman-auto/expert_recipe below remains only as a safety fallback —
# the chooser's db_set (run here, before partman-auto reads the recipe) wins.
d-i partman/early_command string \
    _found=0 ; \
    if ! [ -f /cdrom/ncz-payload/disk-fs-chooser.sh ] && ! [ -f /hd-media/ncz-payload/disk-fs-chooser.sh ] && ! [ -f /media/cdrom/ncz-payload/disk-fs-chooser.sh ] && ! [ -f /run/live/medium/ncz-payload/disk-fs-chooser.sh ] ; then \
        for D in /cdrom/ncz-payload /hd-media/ncz-payload /media/cdrom/ncz-payload /run/live/medium/ncz-payload ; do \
            [ -f "$D/disk-fs-chooser.sh" ] && _found=1 && break ; \
        done ; \
        if [ "$_found" != 1 ] ; then \
            _devlist="/dev/sr0 /dev/sr1" ; \
            for _blk in /sys/block/sd* /sys/block/vd* /sys/block/nvme*n* /sys/block/mmcblk* ; do \
                [ -e "$_blk" ] || continue ; \
                _bn=$(basename "$_blk") ; \
                _devlist="$_devlist /dev/$_bn" ; \
                for _part in "$_blk"/"$_bn"*/partition ; do \
                    [ -e "$_part" ] || continue ; \
                    _devlist="$_devlist /dev/$(basename "$(dirname "$_part")")" ; \
                done ; \
            done ; \
            for _m in ext4 ext2 isofs vfat ; do modprobe "$_m" >>/var/log/ncz-media-search.log 2>&1 || true ; done ; \
            for _src_dev in $_devlist ; do \
                [ -b "$_src_dev" ] || continue ; \
                mkdir -p /cdrom 2>/dev/null || true ; \
                for _fs in ext4 iso9660 vfat auto ; do \
                    umount /cdrom 2>/dev/null || true ; \
                    if [ "$_fs" = auto ] ; then \
                        mount -o ro "$_src_dev" /cdrom 2>>/var/log/ncz-media-search.log || continue ; \
                    else \
                        mount -t "$_fs" -o ro "$_src_dev" /cdrom 2>>/var/log/ncz-media-search.log || continue ; \
                    fi ; \
                    if [ -f /cdrom/ncz-payload/disk-fs-chooser.sh ] ; then \
                        echo "media-search: payload found on $_src_dev as $_fs" >> /var/log/ncz-media-search.log ; \
                        _found=1 ; break ; \
                    fi ; \
                    echo "media-search: $_src_dev mounted as $_fs but has no ncz-payload/ payload" >> /var/log/ncz-media-search.log ; \
                done ; \
                [ "$_found" = 1 ] && break ; \
                umount /cdrom 2>/dev/null || true ; \
            done ; \
        fi ; \
        if [ "$_found" != 1 ] ; then \
            for _src_dev in $(awk '$3~/^(iso9660|vfat|ext[234])$/{print $2}' /proc/mounts 2>/dev/null) ; do \
                mkdir -p /cdrom 2>/dev/null || true ; \
                umount /cdrom 2>/dev/null || true ; \
                mount --bind "$_src_dev" /cdrom 2>/dev/null && \
                    [ -f /cdrom/ncz-payload/disk-fs-chooser.sh ] && _found=1 && break ; \
                umount /cdrom 2>/dev/null || true ; \
            done ; \
        fi ; \
    fi ; \
    for D in /cdrom/ncz-payload /hd-media/ncz-payload /media/cdrom/ncz-payload /run/live/medium/ncz-payload ; do \
        [ -f "$D/disk-fs-chooser.sh" ] || continue ; \
        _found=1 ; \
        _sl=/var/log/ncz-debootstrap-stub.log ; \
        for _u in "$D"/debootstrap-udeb/*.udeb ; do \
            [ -f "$_u" ] || continue ; \
            echo "installing patched debootstrap stub from $_u" >> $_sl ; \
            udpkg -i "$_u" >>$_sl 2>&1 || udpkg --unpack "$_u" >>$_sl 2>&1 || \
                echo "WARNING: udpkg could not install $_u" >> $_sl ; \
        done ; \
        if grep -q "ncz r40 stub debootstrap" /usr/sbin/debootstrap 2>/dev/null ; then \
            echo "OK: /usr/sbin/debootstrap is the NCZ layered-squashfs stub" >> $_sl ; \
        else \
            for V in /dev/console /dev/tty1 /dev/tty3; do echo "[ncz] FATAL: /usr/sbin/debootstrap is NOT the NCZ squashfs stub. bootstrap-base would network-debootstrap a bare Debian instead of extracting base.squashfs. Refusing now, before any disk is touched. See $_sl" > "$V" 2>/dev/null || true ; done ; \
            exit 1 ; \
        fi ; \
        NCZ_MEDIA_DIR="$D" ; export NCZ_MEDIA_DIR ; \
        sh "$D/disk-fs-chooser.sh" || exit $? ; \
        break ; \
    done ; \
    if [ "$_found" != 1 ] ; then for V in /dev/console /dev/tty1 /dev/tty3; do echo "[ncz] FATAL: disk-fs-chooser.sh not found on install media -- refusing to let partman auto-pick a disk. Tried: $_devlist -- see /var/log/ncz-media-search.log" > "$V" 2>/dev/null || true ; done ; exit 1 ; fi
d-i partman/early_command seen true

##############################################################################
# THERE IS NO partman/late_command. Verified 2026-09-24 against the real
# partman-base 241 udeb from the pinned forky archive: its only preseed hook
# is usr/lib/partman/init.d/01early_command, which runs `preseed_command
# partman/early_command`. Nothing anywhere runs partman/late_command.
#
# This file used to set it, to run extract-rootfs.sh. That directive was
# dead on arrival -- it never executed on any install -- and it read as a
# working rootfs-extraction step, which is exactly how the real gap below
# stayed hidden. extract-rootfs.sh itself has said so in its own header
# since 2026-08-26 ("DEAD-CODE TWIN ... this script never runs in
# production"); it is kept on the medium and drift-checked against the stub
# by build/check-extract-rootfs-consistency.sh, not executed.
#
# The ONE live path that puts base.squashfs into /target is the r159 stub
# that replaces /usr/sbin/debootstrap, which bootstrap-base calls with
# /target once partman has mounted it. partman/early_command above is what
# installs that stub (from ncz-payload/debootstrap-udeb/) and refuses to
# continue if it is not in place.
##############################################################################

# r130: deliberately NO partman-auto/disk preseed — leaving it unset is what
# makes d-i present the disk-selection menu so the operator picks the target.
d-i partman-auto/method string regular
d-i partman-auto/method seen true
# r130: btrfs root preserved from r116, now with a dedicated rescue partition.
# Layout (3 primary partitions on the OPERATOR-CHOSEN disk):
#   p1: 4 GB  fat32 ESP    (method{ efi })                     -> /boot/efi  (r133: 1->4 GiB, kernel-dev headroom)
#   p2: 4 GB  ext4  rescue (label NCZRESCUE, NO mountpoint)    -> 72-rescue-partition.sh
#   p3: rest  btrfs root   (method{ format })                  -> /
# No swap (cixmini is a 64 GB-RAM edge box). btrfs feasibility verified r116:
#   - kernel CONFIG_BTRFS_FS=m; btrfs.ko + deps (crc32c/xor/raid6/zstd) ship
#     in the 7.0.12-cix-sky1-next module set (installer initrd + installed).
#   - partman-btrfs_59 + btrfs-progs-udeb_6.2 are in the ISO pool/udeb index.
# The rescue partition is ext4 (the rescue rootfs builder emits an ext4 image);
# btrfs-progs ships in the rescue toolset so the rescue env can mount the main
# btrfs root.
d-i partman-auto/expert_recipe string                         \
      cixmini ::                                              \
              2048 2048 2048 fat32                            \
                      $primary{ } $bootable{ }                \
                      method{ efi } format{ }                 \
              .                                               \
              4096 4096 4096 ext4                             \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      label{ NCZRESCUE }                      \
              .                                               \
              4096 8192 -1 btrfs                              \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ btrfs }   \
                      mountpoint{ / }                         \
              .
d-i partman-auto/expert_recipe seen true
d-i partman-auto/choose_recipe select cixmini
d-i partman-auto/choose_recipe seen true
# btrfs single-volume root carries no swap partition; suppress the d-i
# "no swap" warning so the unattended run doesn't stall.
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-basicfilesystems/no_swap seen true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/device_remove_lvm seen true
d-i partman-md/device_remove_md boolean true
d-i partman-md/device_remove_md seen true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm seen true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/confirm_nooverwrite seen true
# r130.1 SIMPLIFIED FLOW (operator feedback: the prior half-seen confirm flow
# broke the disk chooser — d-i applied the recipe but then stalled on the
# unacknowledged "write changes?" prompts). Now the operator's ONLY interaction
# is picking the target disk (partman-auto/disk left unset above). Once a disk
# is chosen, partman applies the recipe (ESP + rescue + btrfs root) and writes
# WITHOUT further prompts — the disk selection itself is the consent to wipe it.
# Every confirm question is marked `seen` so nothing stalls the flow.
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm_write_new_label seen true
d-i partman/choose_partition select finish
d-i partman/choose_partition seen true
d-i partman/unmount_active boolean true
d-i partman/unmount_active seen true
d-i partman/confirm boolean true
d-i partman/confirm seen true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm_nooverwrite seen true
# r130.1 CRITICAL FIX (Codex review): the 4GB ext4 RESCUE partition has NO
# mountpoint by design (72-rescue-partition.sh populates it post-install). d-i
# raises partman-basicfilesystems/no_mount_point ("No mount point is assigned
# for the ext4 filesystem ... return to the partitioning menu?") for exactly
# this case. Unseeded, it STALLS the unattended flow at finish — this was the
# broken disk chooser. Answer "return to menu? = NO" (false) so partman
# continues and leaves the rescue partition unmounted (its intended state).
d-i partman-basicfilesystems/no_mount_point boolean false
d-i partman-basicfilesystems/no_mount_point seen true
# Insurance: the parallel partman-partitioning namespace also owns a
# write-new-label confirm on some paths. Seed it so nothing stalls.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-partitioning/confirm_write_new_label seen true

##############################################################################
# Base system — debootstrap resolute with the gutsy script
#
# Bookworm's debootstrap (1.0.128) doesn't have a "resolute" script.
# Ubuntu debootstrap 1.0.141ubuntu1+ adds resolute as an upstream symlink,
# and Ubuntu codenames since gutsy (2007) use that same script family.
# So we tell base-installer to use the gutsy script for our resolute suite.
# Codex r26 review caught this — without the override, debootstrap fails
# with "No such script: resolute".
##############################################################################
d-i base-installer/debootstrap_script string gutsy
d-i base-installer/debootstrap_script seen true

# Skip the d-i kernel image install — we provide our own via late_command.
d-i base-installer/kernel/image string none
d-i base-installer/kernel/image seen true

# kernel/image=none is NOT sufficient on bookworm base-installer: when apt
# finds zero kernels in the (offline) sources it still raises the
# "no installable kernel found" prompt and blocks the install. take79
# suppressed it with these three; they were lost in the 26.6 preseed and
# the 26.6 build halted base-installer here. Our 3 kernels (6.18 LTS daily,
# 6.18 LTS rescue/safe, NEXT beta) are installed by post-install/10-our-kernel.sh.
d-i base-installer/kernel/skip-install boolean true
d-i base-installer/kernel/skip-install seen true
d-i base-installer/kernel/no-kernels-found boolean true
d-i base-installer/kernel/no-kernels-found seen true
d-i base-installer/kernel/failed-install boolean true
d-i base-installer/kernel/failed-install seen true

##############################################################################
# APT setup — cdrom-only during the install itself. The INSTALLED system's
# base repo is written by post-install/23-base-apt-sources.sh from
# release.conf (the pinned snapshot, with Check-Valid-Until: no); late.sh
# handles the rest. The "ports.ubuntu.com" this comment used to name has not
# been this project's mirror since the move to Debian forky.
##############################################################################
# r179: EMPTY security_host + seen so apt-setup never scans a network security
# repo during install (belt-and-suspenders with services-select empty+seen).
# The installed system's ports.ubuntu.com sources are written by late.sh.
d-i apt-setup/security_host string
d-i apt-setup/security_host seen true
d-i apt-setup/security_path string
d-i apt-setup/security_path seen true

# Add Ubuntu universe + multiverse + restricted repos for the post-install
# /etc/apt/sources.list (apt-setup writes this even though install uses cdrom)
d-i apt-setup/restricted boolean true
d-i apt-setup/restricted seen true
d-i apt-setup/multiverse boolean true
d-i apt-setup/multiverse seen true
d-i apt-setup/universe boolean true
d-i apt-setup/universe seen true
# 2026-05-08 take24: STRIP Debian-style apt components — Ubuntu (resolute)
# uses main+universe+restricted+multiverse only. The previous
# `non-free` + `non-free-firmware` directives (Debian-style) caused
# apt-setup to write them into /target/etc/apt/sources.list, which
# generated repeated apt warnings ("doesn't have the component
# 'contrib'/'non-free'/...") and contributed to pkgsel-time noise.
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/non-free-firmware seen true
d-i apt-setup/non-free boolean false
d-i apt-setup/non-free seen true
d-i apt-setup/contrib boolean false
d-i apt-setup/contrib seen true

##############################################################################
# Tasksel — skip Debian-specific tasks (would fail on Ubuntu suite anyway)
##############################################################################
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/run_tasksel seen true
tasksel tasksel/first multiselect

# r178: pkgsel/include is EMPTY — "Select and install software" is a NO-OP.
#
# The layered base+desktop squashfs installed by the STUB IS the complete system
# (network-manager, xfce, falkon, openssh-server, ca-certificates, curl, gnupg,
# lsb-release, sudo, zstd, etc. are ALL already baked — verified via dpkg status
# in the squashfs). Running pkgsel's apt-get install of an include list is
# therefore redundant AND it created a hard dependency on a reachable/complete
# APT mirror: with no reachable mirror that step exits non-zero → "[!!] Select
# and install software — Installation step failed" and the install never
# reaches finish/reboot (observed on native-arm64 .66, r177). Empty include +
# run_tasksel=false (below) makes pkgsel a genuine no-op, so pkgsel adds no
# network dependency of its own on top of the one anna already has.
#
# EXCEPTION — telnetd (doctrine #9 fleet lockout-prevention): inetutils-telnetd +
# openbsd-inetd are the only formerly-included packages NOT yet baked into the
# squashfs. They are added to manifests/desktop.pkgs for the next squashfs bake;
# until that lands, late.sh installs them from the local /cdrom pool (NOT a
# network mirror), so every installed host still has telnet.
d-i pkgsel/include string
d-i pkgsel/include seen true
# 2026-05-08 take24: pkgsel's default set pulls Debian-only packages
# that don't exist on Ubuntu resolute. Without explicit exclude,
# `apt-get install discover installation-report popularity-contest`
# returns "Unable to locate package" → pkgsel exits 100 → install fails.
# These are all Debian-specific (Ubuntu uses udev for discover, has
# no installation-report mailer, uses ubuntu-popcon if any popcon).
d-i pkgsel/exclude string discover installation-report popularity-contest
d-i pkgsel/exclude seen true
popularity-contest popularity-contest/participate boolean false
popularity-contest popularity-contest/participate seen true
d-i pkgsel/upgrade select none
d-i pkgsel/upgrade seen true
d-i pkgsel/update-policy select none
d-i pkgsel/update-policy seen true
d-i pkgsel/updatedb boolean false
d-i pkgsel/updatedb seen true

# 2026-05-07 take9 (per pkgsel-cascade-failure on .66 take8 install):
# don't pull Recommends. The 30-deep python3-launchpadlib dep chain that
# Ubuntu's openssh-server Recommends (via ssh-import-id) is what got us
# into "Temporary failure resolving" cascade-fail when one transient DNS
# blip aborted the whole batch. With Recommends off, we install just the
# 6 explicit packages and their hard Depends — much smaller download
# set, much smaller blast radius.
d-i pkgsel/install-recommends boolean false
d-i pkgsel/install-recommends seen true
# 2026-05-08 (Codex r78 take13 audit MEDIUM #1): the documented Debian
# d-i question is pkgsel/include/install-recommends — pkgsel/install-recommends
# is the historical Ubuntu name and likely silently ignored by trixie d-i.
# Preseed both so we cover bookworm + trixie + Ubuntu d-i variants.
d-i pkgsel/include/install-recommends boolean false
d-i pkgsel/include/install-recommends seen true

# 2026-05-07 take10: same logic for base-installer. Take9's pkgsel fix
# only covered pkgsel; base-installer was still pulling its own Recommends
# (libpng16, libfuse3, gettext-base, etc.) and hitting the same DNS
# cascade-fail.
d-i base-installer/install-recommends boolean false
d-i base-installer/install-recommends seen true

##############################################################################
# Bootloader — d-i installs GRUB to ESP. Our 70-bootloader.sh in late.sh
# replaces it with systemd-boot + our Sky1 kernel + working cmdline.
##############################################################################
# r45: skip grub-installer entirely. We use systemd-boot via post-install
# hook 70-bootloader.sh, so the target system does not need GRUB. d-i's
# grub-installer also tries to call grub-install with --force-extra-removable
# which the cloudimg rootfs grub does not support — skipping avoids both
# issues. preseed/late_command (our late.sh) runs anyway and our hook chain
# writes the proper systemd-boot loader entries.
d-i grub-installer/skip boolean true
d-i grub-installer/skip seen true
# Debian forky's d-i also ships systemd-boot-installer, which resolute/bookworm
# did not, so skipping grub-installer alone no longer skips the bootloader step:
# main-menu runs systemd-boot-installer instead, bootctl fails under the
# installer's efi=noruntime cmdline, and the install stops on a critical
# "Installation step failed: Install the systemd-boot boot loader" dialog after
# the base system is already on disk. We install the bootloader ourselves from
# post-install/70-bootloader.sh (rEFInd), so skip this step the same way.
d-i systemd-boot-installer/skip boolean true
d-i systemd-boot-installer/skip seen true
d-i nobootloader/confirmation_common boolean true
d-i nobootloader/confirmation_common seen true

# Legacy lines kept commented for reference if we ever flip back to GRUB:
# d-i grub-installer/only_debian boolean true
# d-i grub-installer/with_other_os boolean true
# d-i grub-installer/bootdev string default

##############################################################################
# Late command — invoke our NCZ bootstrapper.
##############################################################################
# 2026-09-24: this was still hardcoded to /cdrom/ncz-payload/late.sh -- the last
# hook that had not been given the fallback search commit b5b5da1 added for
# extract-rootfs.sh and partman/early_command. On raw-GPT USB media the payload
# is not guaranteed to be mounted at /cdrom, and a miss here means late.sh
# never runs at all: no post-install hooks, no bootloader, no kernel config,
# on a system that has otherwise finished installing.
d-i preseed/late_command string \
    for D in /cdrom/ncz-payload /hd-media/ncz-payload /media/cdrom/ncz-payload /run/live/medium/ncz-payload ; do \
        if [ -f "$D/late.sh" ] ; then sh "$D/late.sh" ; exit $? ; fi ; \
    done ; \
    for V in /dev/console /dev/tty1 /dev/tty3; do echo "[ncz] FATAL: late.sh not found on install media" > "$V" 2>/dev/null || true ; done ; \
    exit 1
d-i preseed/late_command seen true

##############################################################################
# Finish
d-i finish-install/keep-consoles boolean true
d-i finish-install/keep-consoles seen true
# r160: suppress the final "Installation complete — <Continue> to reboot"
# dialog. Without this note preseeded, an unattended install sits at the
# Finish screen forever (observed r159 in the qemu harness).
d-i finish-install/reboot_in_progress note
##############################################################################
d-i debian-installer/exit/poweroff boolean false
d-i debian-installer/exit/poweroff seen true
d-i debian-installer/exit/reboot boolean true
d-i debian-installer/exit/reboot seen true

# r157 (codex/Debian-sourced): baked rootfs already ships a kernel. d-i must NOT
# install another, else needrestart raises a CRITICAL kernel-reboot note that
# stalls the install before late_command/70-bootloader (no bootloader installed).
d-i base-installer/kernel/image select none
d-i base-installer/kernel/image seen true
d-i base-installer/kernel/skip-install boolean true
d-i base-installer/kernel/skip-install seen true
